<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Breakout 3D — Neon Edition</title>
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');
:root {
  --bg: #02040a;
  --neon-cyan: #00f5ff;
  --neon-pink: #ff006e;
  --neon-yellow: #ffe600;
  --neon-green: #00ff88;
  --glow-cyan: 0 0 8px #00f5ff, 0 0 20px #00f5ffaa, 0 0 40px #00f5ff44;
  --glow-pink: 0 0 8px #ff006e, 0 0 20px #ff006eaa, 0 0 40px #ff006e44;
  --glow-yellow: 0 0 8px #ffe600, 0 0 20px #ffe600aa;
  --glow-green: 0 0 8px #00ff88, 0 0 20px #00ff88aa;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden; background: var(--bg);
  font-family: 'Share Tech Mono', monospace; color: var(--neon-cyan);
  user-select: none; -webkit-user-select: none; touch-action: none;
}
#gl, #hud { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#gl  { z-index: 0; }
#hud { z-index: 1; pointer-events: none; }
/* soft cinematic vignette (no scanlines — they banded badly in perspective) */
#vignette {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background: radial-gradient(ellipse 92% 82% at 50% 43%, transparent 46%, #02040a8c 80%, #02040ae8 100%);
}

/* ---- floating HUD chrome ---- */
.hud-el { position: fixed; z-index: 2; pointer-events: none; }
#title-block { top: 16px; left: 20px; }
.title {
  font-family: 'Orbitron', sans-serif; font-weight: 900;
  font-size: clamp(15px, 2.4vw, 26px); letter-spacing: 5px;
  color: var(--neon-cyan); text-shadow: var(--glow-cyan); text-transform: uppercase;
}
#score-block { top: 16px; right: 22px; text-align: right; }
.stat-label { font-size: 9px; letter-spacing: 3px; color: #00f5ff77; text-transform: uppercase; }
.stat-value {
  font-family: 'Orbitron', sans-serif; font-size: clamp(18px, 3vw, 30px);
  font-weight: 700; color: var(--neon-yellow); text-shadow: var(--glow-yellow);
}
#lives-block { bottom: 18px; left: 20px; display: flex; gap: 8px; align-items: center; }
.lives-label { font-size: 9px; letter-spacing: 3px; color: #00f5ff66; text-transform: uppercase; margin-right: 2px; }
#pips { display: flex; gap: 7px; align-items: center; }
.life-pip {
  width: 22px; height: 7px; background: var(--neon-pink); box-shadow: var(--glow-pink);
  clip-path: polygon(4px 0%, 100% 0%, calc(100% - 4px) 100%, 0% 100%);
}
#level-display { margin-left: 14px; font-size: 9px; letter-spacing: 3px; color: #00f5ff66; text-transform: uppercase; }
#level-num { color: var(--neon-green); text-shadow: var(--glow-green); font-family: 'Orbitron', sans-serif; font-weight: 700; }
#powerup-row { bottom: 18px; right: 22px; display: flex; gap: 6px; align-items: center; min-height: 16px; }
.pu-pill {
  font-size: 8px; letter-spacing: 2px; padding: 3px 8px; border: 1px solid;
  text-transform: uppercase; font-family: 'Orbitron', sans-serif; font-weight: 700;
  background: #02040a99;
}
.pu-wide   { color: #00ff88; border-color: #00ff88; box-shadow: 0 0 6px #00ff8866; }
.pu-slow   { color: #00f5ff; border-color: #00f5ff; box-shadow: 0 0 6px #00f5ff66; }
.pu-multi  { color: #ffe600; border-color: #ffe600; box-shadow: 0 0 6px #ffe60066; }
.pu-laser  { color: #ff006e; border-color: #ff006e; box-shadow: 0 0 6px #ff006e66; }
.pu-catch  { color: #bf00ff; border-color: #bf00ff; box-shadow: 0 0 6px #bf00ff66; }
.pu-pierce { color: #ff6a00; border-color: #ff6a00; box-shadow: 0 0 6px #ff6a0066; }
.pu-shrink { color: #ff3344; border-color: #ff3344; box-shadow: 0 0 6px #ff334466; }

/* ---- start / game-over overlay ---- */
#overlay {
  position: fixed; inset: 0; z-index: 3;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: radial-gradient(circle at 50% 45%, #04122099, #02040af2 70%);
  visibility: visible;
  transition: opacity 0.35s, visibility 0s;
}
/* visibility flips only after the fade, so a stalled transition can never leave
   the menu painted over live gameplay */
#overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 0.35s, visibility 0s 0.35s; }
.overlay-title {
  font-family: 'Orbitron', sans-serif; font-weight: 900;
  font-size: clamp(26px, 9vw, 72px); letter-spacing: 8px;
  color: var(--neon-cyan); text-shadow: var(--glow-cyan);
  margin-bottom: 8px; text-align: center;
}
.overlay-sub {
  font-size: clamp(9px, 2.4vw, 12px); letter-spacing: 3px; color: #00f5ff88;
  margin-bottom: 30px; text-transform: uppercase; text-align: center;
  padding: 0 16px; line-height: 2.1;
}
.start-btn {
  font-family: 'Orbitron', sans-serif; font-weight: 700;
  font-size: clamp(11px, 3vw, 15px); letter-spacing: 4px;
  color: var(--bg); background: var(--neon-cyan); border: none;
  padding: 14px 40px; cursor: pointer; text-transform: uppercase;
  box-shadow: var(--glow-cyan); pointer-events: auto;
  clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
  transition: all 0.2s;
}
.start-btn:hover, .start-btn:active {
  background: var(--neon-pink); box-shadow: var(--glow-pink); transform: scale(1.06);
}
.hi-score-line { margin-top: 20px; font-size: 11px; letter-spacing: 3px; color: #00f5ff55; }
.hi-score-val { color: var(--neon-yellow); }
</style>
</head>

<!-- The engine streams from a CDN; if that never arrives, say so instead of showing a black void. -->
<script>
setTimeout(function () {
  if (window.__booted) return;
  var sub = document.getElementById('overlay-sub'), btn = document.getElementById('start-btn');
  if (sub) sub.innerHTML = 'ENGINE DID NOT LOAD<br>three.js streams from unpkg.com — check the connection, then reload.';
  if (btn) { btn.textContent = 'RELOAD'; btn.onclick = function () { location.reload(); }; }
}, 10000);
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

window.__booted = true;

/* ============================================================
   LOGICAL GAME SPACE  (unchanged 2D physics: 480 x 560)
   ============================================================ */
const LW = 480, LH = 560;

/* ---------------- audio (high-quality headphone) ---------------- */
const AC = (() => {
  try { return new (window.AudioContext || window.webkitAudioContext)(); }
  catch(e) { return null; }
})();
let muted = false;

// Master chain: sources → masterOut → compressor → speakers
let masterOut, reverbIn;
(function initAudio() {
  if (!AC) return;
  masterOut = AC.createGain();
  masterOut.gain.value = 0.78;
  const comp = AC.createDynamicsCompressor();
  comp.threshold.value = -14; comp.knee.value = 8;
  comp.ratio.value = 5; comp.attack.value = 0.002; comp.release.value = 0.18;
  masterOut.connect(comp); comp.connect(AC.destination);

  // Procedural room reverb via convolution
  reverbIn = AC.createConvolver();
  const rate = AC.sampleRate, rLen = Math.floor(rate * 0.55);
  const ir = AC.createBuffer(2, rLen, rate);
  for (let c = 0; c < 2; c++) {
    const ch = ir.getChannelData(c);
    for (let i = 0; i < rLen; i++) ch[i] = (Math.random()*2-1) * Math.pow(1-i/rLen, 2.8);
  }
  reverbIn.buffer = ir;
  const rvbG = AC.createGain(); rvbG.gain.value = 0.15;
  reverbIn.connect(rvbG); rvbG.connect(masterOut);
})();

function xPan(x) { return Math.max(-1, Math.min(1, (x / LW) * 2 - 1)); }

function wireOut(node, pan, withReverb) {
  if (!masterOut) return;
  if (pan !== 0 && AC.createStereoPanner) {
    const p = AC.createStereoPanner(); p.pan.value = pan;
    node.connect(p); p.connect(masterOut);
    if (withReverb) p.connect(reverbIn);
  } else {
    node.connect(masterOut);
    if (withReverb) node.connect(reverbIn);
  }
}

// Soft attack by default keeps every cue click-free and gentle (ASMR).
function tone(freq, type, dur, vol = 0.15, startDelay = 0, pan = 0, reverb = false, atk = 0.012) {
  if (!AC || muted) return;
  try {
    const t = AC.currentTime + startDelay;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + Math.min(atk, dur * 0.5));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); wireOut(g, pan, reverb);
    o.start(t); o.stop(t + dur + 0.02);
  } catch(e) {}
}

function sweep(f0, f1, type, dur, vol = 0.12, startDelay = 0, pan = 0, reverb = false, atk = 0.012) {
  if (!AC || muted) return;
  try {
    const t = AC.currentTime + startDelay;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t);                          // soft swell, no hard transient
    g.gain.linearRampToValueAtTime(vol, t + Math.min(atk, dur * 0.5));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); wireOut(g, pan, reverb);
    o.start(t); o.stop(t + dur + 0.02);
  } catch(e) {}
}

// filterType 'lowpass' gives a warm, airy whisper; 'bandpass' a textured hiss.
function noise(dur, vol = 0.1, bandFreq = 800, startDelay = 0, pan = 0, q = 2, reverb = false, filterType = 'bandpass') {
  if (!AC || muted) return;
  try {
    const t = AC.currentTime + startDelay;
    const frames = Math.ceil(AC.sampleRate * dur);
    const buf = AC.createBuffer(2, frames, AC.sampleRate);
    for (let c = 0; c < 2; c++) {
      const ch = buf.getChannelData(c);
      for (let i = 0; i < frames; i++) ch[i] = Math.random()*2-1;
    }
    const src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    src.buffer = buf;
    f.type = filterType; f.frequency.value = bandFreq; f.Q.value = q;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + Math.min(0.008, dur * 0.5));  // softer onset
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); wireOut(g, pan, reverb);
    src.start(t);
  } catch(e) {}
}

const SFX = {
  // soft rounded "tok" off the walls
  wall: (x = LW/2) => {
    const p = xPan(x);
    noise(0.02, 0.045, 1400, 0, p, 0.8, false, 'lowpass');
    tone(680, 'sine', 0.05, 0.05, 0, p, false, 0.006);
  },
  // warm cushioned "thup" off the paddle
  paddle: (x = LW/2) => {
    const p = xPan(x);
    tone(120, 'sine', 0.11, 0.16, 0, p, true, 0.01);
    tone(240, 'sine', 0.07, 0.08, 0, p);
    noise(0.025, 0.04, 600, 0, p, 0.7, false, 'lowpass');
  },
  // gentle muted tap when a brick is only chipped
  hit: (x = LW/2) => {
    const p = xPan(x);
    noise(0.03, 0.05, 900, 0, p, 0.8, true, 'lowpass');
    tone(360, 'sine', 0.06, 0.06, 0, p, false, 0.008);
  },
  // bright liquid "drip" ear-candy; combos climb a tiny pentatonic hook
  break: (x = LW/2, streak = 1) => {
    const p = xPan(x);
    const hook = [1, 9/8, 5/4, 3/2, 5/3][Math.min(Math.max(streak - 1, 0), 4)];
    sweep(1480 * hook, 690 * hook, 'sine', 0.095, 0.105, 0,     p, true, 0.002); // glossy plink
    sweep(520  * hook, 245 * hook, 'sine', 0.17,  0.11,  0.016, p, true, 0.004); // round droplet body
    tone(1040  * hook, 'sine',              0.11,  0.026, 0.026, p, true, 0.003); // clean shimmer
    noise(0.024, 0.018, 3400, 0, p, 4.5, true, 'bandpass');                     // tiny fizzy snap
  },
  // breathy, airy "pew" rather than a buzzy zap
  laser: (x = LW/2) => {
    const p = xPan(x);
    sweep(1400, 520, 'sine',     0.10, 0.05,  0,     p, true);
    sweep(900,  360, 'triangle', 0.09, 0.035, 0.012, p);
    noise(0.06, 0.025, 1800, 0, p, 0.8, true, 'lowpass');
  },
  // soft chest-thump detonation — low body, airy tail, no harsh transient
  boom: (x = LW/2, depth = 1) => {
    const p = xPan(x);
    sweep(150 * depth, 44 * depth, 'sine',     0.44, 0.20, 0,     p, true, 0.006);
    sweep(300 * depth, 96 * depth, 'triangle', 0.26, 0.07, 0.004, p, true, 0.008);
    noise(0.34, 0.055, 420, 0, p, 0.6, true, 'lowpass');
    noise(0.13, 0.022, 2600, 0.01, p, 3.0, true, 'bandpass');
  },
  catch: (x = LW/2) => {
    const p = xPan(x);
    tone(700,  'sine', 0.14, 0.08, 0,    p, true, 0.02);
    tone(1050, 'sine', 0.16, 0.06, 0.04, p, true, 0.02);
    tone(1400, 'sine', 0.11, 0.04, 0.08, p, true, 0.02);
  },
  powerup: () => {
    [523,659,784,1047].forEach((f,i) => {
      tone(f,     'sine', 0.20, 0.12, i*0.07, 0, true, 0.02);
      tone(f*1.5, 'sine', 0.13, 0.035, i*0.07, 0, false, 0.02);
    });
  },
  bad: () => {
    [330,260,200].forEach((f,i) => sweep(f, f*0.65, 'triangle', 0.18, 0.10, i*0.09, 0, true));
  },
  life: () => {
    [360,280,210,150].forEach((f,i) => tone(f, 'triangle', 0.20, 0.11, i*0.12, 0, true, 0.02));
  },
  extra: () => {
    [523,784,1047,1319].forEach((f,i) => {
      tone(f,     'sine', 0.22, 0.12, i*0.06, 0, true, 0.02);
      tone(f*0.5, 'sine', 0.15, 0.045, i*0.06, 0, false, 0.02);
    });
  },
  level: () => {
    [523,659,784,880,1047].forEach((f,i) => {
      tone(f,     'sine',     0.24, 0.10, i*0.09, 0, true, 0.025);
      tone(f*1.5, 'triangle', 0.19, 0.035, i*0.09, 0, false, 0.025);
    });
  },
  over: () => {
    [280,220,180,140,100].forEach((f,i) => tone(f, 'triangle', 0.32, 0.12, i*0.2, 0, true, 0.03));
    noise(0.5, 0.03, 180, 0.6, 0, 0.5, true, 'lowpass');
  },
};
function resumeAC() { if (AC && AC.state === 'suspended') AC.resume(); }

/* ---------------- palette + levels (verbatim) ---------------- */
const PX = {
  r:'#ff006e', o:'#ff6a00', y:'#ffe600', g:'#00ff88',
  c:'#00f5ff', b:'#3a86ff', p:'#bf00ff', w:'#f5f9ff', m:'#ff5fd2'
};
const LEVEL_NAMES = [
  'INITIATE','PYRAMID','HEARTBEAT','INVADER','SMILE',
  'STARFALL','PRISM','SKULL','VOLTAGE','FORTRESS',
  'FUNGUS','PHANTOM','FELINE','LIFTOFF','ROYALTY',
  'SAUCER','ABYSS','LABYRINTH','PAPILLON','OMEGA',
  'CASCADE','SUPERNOVA'
];
const LEVEL_MAPS = [
  ['cccccccccc','gggggggggg','yyyyyyyyyy','oooooooooo'],
  ['.....c.....','....ccc....','...ccccc...','..ccccccc..','.ccccccccc.','ccccccccccc'],
  ['..rr...rr..','.rrrr.rrrr.','rrrrrrrrrrr','rrrrrrrrrrr','.rrrrrrrrr.','..rrrrrrr..','...rrrrr...','....rrr....','.....r.....'],
  ['..p.....p..','...p...p...','..ppppppp..','.pp.ppp.pp.','ppppppppppp','p.ppppppp.p','p.p.....p.p','...pp.pp...'],
  ['...yyyyy...','.yyyyyyyyy.','yyyyyyyyyyy','yyy.yyy.yyy','yyy.yyy.yyy','yyyyyyyyyyy','yyy.....yyy','.yyyyyyyyy.','...yyyyy...'],
  ['.....y.....','.....y.....','....yyy....','yyyyyyyyyyy','.yyyyyyyyy.','..yyyyyyy..','..yyy.yyy..','.yy.....yy.','.y.......y.'],
  ['.....c.....','....ccc....','...ccccc...','..ccccccc..','.ccccccccc.','ccccccccccc','.ccccccccc.','..ccccccc..','...ccccc...','....ccc....','.....c.....'],
  ['..wwwwwww..','.wwwwwwwww.','wwwwwwwwwww','ww..www..ww','ww..www..ww','wwwww.wwwww','.wwwwwwwww.','.w.w.w.w.w.'],
  ['......yyy..','.....yyy...','....yyy....','..yyyyyyy..','....yyy....','...yyy.....','..yyy......','.yyy.......'],
  ['###########','#ccccccccc#','#cyyyyyyyc#','#cyrr*rryc#','#cyyyyyyyc#','#ccccccccc#','###########'],
  ['...rrrrr...','..rrwwwrr..','.rrwwwwwrr.','rrwwrrrwwrr','rrrrrrrrrrr','...wwwww...','...wwwww...','...wwwww...'],
  ['...ppppp...','..ppppppp..','.ppppppppp.','.pwwpppwwp.','.pwwpppwwp.','.ppppppppp.','.ppppppppp.','.p.p.p.p.p.'],
  ['gg.......gg','ggg.....ggg','ggggggggggg','gg.ggggg.gg','ggggggggggg','ggggg.ggggg','ggggggggggg','.ggggggggg.'],
  ['.....r.....','....rrr....','....ccc....','...rrrrr...','...rrrrr...','...rrrrr...','..rrrrrrr..','.rr.rrr.rr.','o..o.o.o..o'],
  ['y....y....y','yy..yyy..yy','yyyyyyyyyyy','yyryyyyyryy','yyyyyyyyyyy'],
  ['...ggggg...','..ggggggg..','.ggggggggg.','ccccccccccc','cycycycycyc'],
  ['......ccc..','c...cccccc.','cc.cccccccc','ccccccc.ccc','cc.cccccccc','c...cccccc.','......ccc..'],
  ['#.#.#.#.#.#','.r.r.r.r.r.','#.#.#.#.#.#','.g.g.*.g.g.','#.#.#.#.#.#','.y.y.y.y.y.','#.#.#.#.#.#'],
  ['pp.......pp','ppp.....ppp','pppp.y.pppp','pppppyppppp','pppp.y.pppp','ppp.....ppp','pp.......pp'],
  ['###.....###','#rrrrrrrrr#','rr.rr*rr.rr','rrr.rrr.rrr','rrrrrrrrrrr','r.r.r.r.r.r','rr*rrrrr*rr','#rrrrrrrrr#'],
  // CASCADE — a linked run across the top (bombs two apart chain), plus two loners at the flanks
  ['ccccccccccc','cyy*.*.*yyc','ccccccccccc','cyyyyyyyyyc','c*.......*c','cyyyyyyyyyc','ccccccccccc'],
  // SUPERNOVA — the centre column lights the arms; the outer bombs stay independent
  ['#....*....#','.pp.....pp.','..p.*.*.p..','...ppppp...','..*.ppp.*..','...ppppp...','..p.*.*.p..','.pp.....pp.','#....*....#']
];
function ballSpeed() { return Math.min(5.028 + level * 0.48, 13.2); }
function buildLayout(level) {
  const map     = LEVEL_MAPS[(level - 1) % LEVEL_MAPS.length];
  const extraHp = Math.floor((level - 1) / LEVEL_MAPS.length);
  return { map, extraHp };
}

/* ---------------- game state ---------------- */
let score, hiScore = 0, lives, level;
let bestLevel = 1;
try {
  hiScore   = +localStorage.getItem('bevvip_breakout_hi')  || 0;
  bestLevel = +localStorage.getItem('bevvip_breakout_lvl') || 1;
} catch(e) {}
let bricks, balls, paddle, particles, drops, lasers = [], popups = [];
let running = false, paused = false;
let mouseX = LW / 2;
let keyL = false, keyR = false;
let lastTap = 0;
const STEP = 1000 / 60;
let lastTime = 0, accumulator = 0;
let combo = 0, comboTimer = 0;
let puWide = 0, puSlow = 0, puMulti = false;
let puLaser = 0, puCatch = 0, puPierce = 0, puShrink = 0, laserCd = 0;
let puLaserLvl = 0;   // 0 none · 1 single centre cannon · 2 twin side cannons
let shake = 0;
let lvFlash = 0;
const LIFE_THRESHOLDS = [5000, 15000, 30000, 50000];
let lifeIdx = 0, extraFlash = 0;

/* impact feel: a few ms of frozen time sells a big hit far better than a bigger explosion */
let hitStop = 0;

/* ---- final grade: lens aberration, film grain, impact shockwave, blast flash ----
   Runs after OutputPass so it works in display space — fringing and grain stay
   the tasteful side of subtle instead of blowing out with the HDR bloom. */
const FinalGrade = {
  uniforms: {
    tDiffuse:  { value: null },
    uTime:     { value: 0 },
    uAberr:    { value: 0.0011 },
    uGrain:    { value: 0.035 },
    uShockT:   { value: 1 },                              // 0→1 ring age; >=1 is idle
    uShockAmp: { value: 0 },
    uShockPos: { value: new THREE.Vector2(0.5, 0.5) },
    uFlash:    { value: 0 },
    uFlashCol: { value: new THREE.Color(1, 1, 1) },
    uAspect:   { value: 1 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
  `,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float uTime, uAberr, uGrain, uShockT, uShockAmp, uFlash, uAspect;
    uniform vec2 uShockPos;
    uniform vec3 uFlashCol;
    varying vec2 vUv;

    float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }

    void main() {
      vec2 uv = vUv;
      vec2 c  = uv - 0.5;
      float r2 = dot(c, c);

      // expanding pressure ring from the last big impact
      vec2 disp = vec2(0.0);
      if (uShockT < 1.0 && uShockAmp > 0.0) {
        vec2 d = (uv - uShockPos) * vec2(uAspect, 1.0);
        float dist = length(d);
        float radius = uShockT * 0.85;
        float band = exp(-pow((dist - radius) / 0.055, 2.0));
        disp = normalize(d + 1e-6) * band * uShockAmp * (1.0 - uShockT) / vec2(uAspect, 1.0);
      }

      // radial chromatic aberration — nothing at the centre, a whisper at the corners
      float ab = uAberr * (0.25 + r2 * 2.6) + length(disp) * 0.35;
      vec2 dir = normalize(c + 1e-6);
      vec3 col;
      col.r = texture2D(tDiffuse, uv + disp + dir * ab).r;
      col.g = texture2D(tDiffuse, uv + disp).g;
      col.b = texture2D(tDiffuse, uv + disp - dir * ab).b;

      // fine sensor grain, strongest in the shadows so highlights stay clean
      float g = hash(uv * vec2(1024.0, 1024.0) + fract(uTime) * 91.7) - 0.5;
      col += g * uGrain * (1.0 - smoothstep(0.15, 0.9, dot(col, vec3(0.333))));

      // blast light, added and centred on the impact — a full-frame mix would just
      // tint the starfield and flatten the blacks
      if (uFlash > 0.0) {
        vec2 fd = (uv - uShockPos) * vec2(uAspect, 1.0);
        float fall = exp(-dot(fd, fd) * 4.5);
        col += uFlashCol * uFlash * (0.06 + 2.6 * fall);
      }
      gl_FragColor = vec4(col, 1.0);
    }
  `
};
const fxPass = new ShaderPass(FinalGrade);
composer.addPass(fxPass);

(function buildFloor() {
  const S = 512;
  const c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  g.fillStyle = '#040f1d'; g.fillRect(0, 0, S, S);
  // depth lanes (vertical in texture → converge to the vanishing point): bright with glow
  g.shadowColor = '#16d8ff'; g.shadowBlur = 9;

/* ---- ball pool ---- */
const ballGeo = new THREE.SphereGeometry(3.6, 20, 20);
const TRAIL_N = 16;                 // samples kept per ball (one per physics step)
const TRAIL_W = 4.6;                // ribbon half-width at the head
const _trailIndex = (() => {        // shared triangle-strip indices for every ribbon
  const idx = new Uint16Array((TRAIL_N - 1) * 6);
  for (let k = 0; k < TRAIL_N - 1; k++) {
    const a = k * 2, o = k * 6;
    idx[o] = a; idx[o+1] = a + 1; idx[o+2] = a + 2;
    idx[o+3] = a + 1; idx[o+4] = a + 3; idx[o+5] = a + 2;
  }
  return idx;
})();
const ballMeshes = [];
function ensureBall(i) {
  if (ballMeshes[i]) return ballMeshes[i];
  const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffe600, emissiveIntensity: 0.95, roughness: 0.2, metalness: 0.1 });
  const m = new THREE.Mesh(ballGeo, mat);
  const light = new THREE.PointLight(0xffe600, 9, 90, 2);
  m.add(light);
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, color: 0xffe600, transparent: true, opacity: 0.32,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  halo.scale.set(12, 12, 1);

  // comet ribbon: a tapered strip reads as speed far better than a one-pixel line
  const tGeo = new THREE.BufferGeometry();
  tGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(TRAIL_N * 2 * 3), 3));
  tGeo.setAttribute('color',    new THREE.BufferAttribute(new Float32Array(TRAIL_N * 2 * 3), 3));
  tGeo.setIndex(new THREE.BufferAttribute(_trailIndex.slice(), 1));
  const tMat = new THREE.MeshBasicMaterial({
    vertexColors: true, transparent: true, opacity: 0.9,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
  });
  const trail = new THREE.Mesh(tGeo, tMat);
  trail.frustumCulled = false;
  field.add(m); field.add(trail);
  return (ballMeshes[i] = { mesh: m, mat, light, trail, halo });
}

/* ---- brick meshes (rebuilt each level) ---- */
const brickObjs = [];
function clearBricks() {
  for (const o of brickObjs) {
    field.remove(o.mesh); field.remove(o.edge);
    o.mesh.geometry.dispose(); o.mesh.material.dispose();
    o.edge.geometry.dispose(); o.edge.material.dispose();
    if (o.core) { field.remove(o.core); o.core.geometry.dispose(); o.core.material.dispose(); }
    if (o.coreHalo) { field.remove(o.coreHalo); o.coreHalo.material.dispose(); }
  }
  brickObjs.length = 0;
}
function buildBrickMeshes() {
  clearBricks();
  for (const br of bricks) {
    const w = br.w * SX, h = br.h * SY, d = 8;
    const radius = Math.min(w, h, d) * 0.22;
    const geo = new RoundedBoxGeometry(w, h, d, 4, radius);
    const col = new THREE.Color(br.color);
    const mat = new THREE.MeshStandardMaterial({
      color: col.clone().multiplyScalar(0.25),
      emissive: col, emissiveIntensity: 0.95,
      roughness: br.fixed ? 0.8 : 0.35, metalness: br.fixed ? 0.7 : 0.3,
      transparent: true, opacity: 1
    });
    const mesh = new THREE.Mesh(geo, mat);
    const baseZ = d / 2 + 0.5;
    mesh.position.set(lx(br.x + br.w / 2), ly(br.y + br.h / 2), baseZ);
    // crisp neon outline (sharp box, sized just inside the rounded face) keeps bricks readable & separated
    const boxGeo = new THREE.BoxGeometry(w - radius, h - radius, d - radius);
    const edge = new THREE.LineSegments(
      new THREE.EdgesGeometry(boxGeo),
      new THREE.LineBasicMaterial({ color: col, transparent: true, opacity: 0.9 })
    );
    boxGeo.dispose();
    edge.position.copy(mesh.position);
    field.add(mesh); field.add(edge);
    br.obj = { mesh, edge, mat, baseZ };

    // bomb bricks carry a live core so you can read the threat at a glance
    if (br.bomb) {
      const core = new THREE.Mesh(
        new THREE.IcosahedronGeometry(Math.min(w, h) * 0.24, 1),
        new THREE.MeshStandardMaterial({ color: 0x2a0800, emissive: 0xffb300, emissiveIntensity: 2.2, roughness: 0.3 })
      );
      core.position.set(mesh.position.x, mesh.position.y, baseZ + d / 2 + 0.6);
      const coreHalo = new THREE.Sprite(new THREE.SpriteMaterial({
        map: glowTex, color: 0xff7a00, transparent: true, opacity: 0.55,
        blending: THREE.AdditiveBlending, depthWrite: false
      }));
      coreHalo.scale.set(w * 1.5, h * 1.5, 1);
      coreHalo.position.copy(core.position);
      field.add(core); field.add(coreHalo);
      br.obj.core = core; br.obj.coreHalo = coreHalo;
    }
    brickObjs.push(br.obj);
  }
}

/* ---- shard debris: bricks come apart into tumbling 3D fragments ----
   One InstancedMesh, unlit + bloom-fed, so a few hundred fragments cost one draw call. */
const SHARD_MAX = 280;
const shardGeo = new THREE.TetrahedronGeometry(1.9);
const shardMesh = new THREE.InstancedMesh(shardGeo, new THREE.MeshBasicMaterial(), SHARD_MAX);
shardMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
shardMesh.frustumCulled = false;
shardMesh.setColorAt(0, new THREE.Color(1, 1, 1));   // allocates the per-instance colour buffer
shardMesh.count = 0;
field.add(shardMesh);
let shards = [];
const _dummy = new THREE.Object3D();
const _spawnCol = new THREE.Color();

function shardBudget() { return quality >= 2 ? 1 : quality === 1 ? 0.55 : 0.25; }
function spawnShards(x, y, color, n, power = 1) {
  n = Math.round(n * shardBudget());
  _spawnCol.set(color);
  const r = _spawnCol.r, g = _spawnCol.g, b = _spawnCol.b;
  for (let i = 0; i < n && shards.length < SHARD_MAX; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = (1.0 + Math.random() * 2.4) * power;
    shards.push({
      x, y, z: 4 + Math.random() * 5,
      // biased down the ramp so debris tumbles toward the player rather than off into the sky
      vx: Math.cos(a) * s, vy: Math.sin(a) * s + 0.5,
      vz: (0.5 + Math.random() * 2.2) * power,
      rx: Math.random() * 6.28, ry: Math.random() * 6.28, rz: Math.random() * 6.28,
      sx: (Math.random() - 0.5) * 0.42, sy: (Math.random() - 0.5) * 0.42, sz: (Math.random() - 0.5) * 0.42,
      size: (0.45 + Math.random() * 0.8) * (0.85 + power * 0.25),
      life: 1, decay: 0.011 + Math.random() * 0.013,
      r, g, b
    });
  }
}
function updateShards() {
  for (const s of shards) {
    s.x += s.vx; s.y += s.vy; s.z += s.vz;
    s.vy += 0.17;                 // pulled down the ramp toward the player
    s.vz -= 0.15;                 // and back onto the board
    if (s.z < 1.2 && s.vz < 0) { s.z = 1.2; s.vz *= -0.4; s.vx *= 0.85; s.vy *= 0.85; }
    s.rx += s.sx; s.ry += s.sy; s.rz += s.sz;
    s.life -= s.decay;
  }
  if (shards.length) shards = shards.filter(s => s.life > 0 && s.y < LH + 90 && s.y > -70);
}

/* ---- shockwave rings ---- */
const RING_MAX = 16;
const ringGeo = new THREE.RingGeometry(0.74, 1.0, 44);
const ringObjs = [];
function ensureRing(i) {
  if (ringObjs[i]) return ringObjs[i];
  const mat = new THREE.MeshBasicMaterial({
    color: 0xffffff, transparent: true, opacity: 1,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
  });
  const mesh = new THREE.Mesh(ringGeo, mat);
  field.add(mesh);
  return (ringObjs[i] = { mesh, mat });
}
let rings = [];
function ringBurst(x, y, color, maxR = 26, decay = 0.055) {
  if (quality === 0 && rings.length > 4) return;
  if (rings.length >= RING_MAX) rings.shift();
  rings.push({ x, y, color, maxR, t: 0, decay });
}
function updateRings() {
  for (const r of rings) r.t += r.decay;
  if (rings.length) rings = rings.filter(r => r.t < 1);
}

/* ---- blast lights: a break briefly lights the tunnel in the brick's own colour ---- */
const blastLights = [];
for (let i = 0; i < 2; i++) {
  const l = new THREE.PointLight(0xffffff, 0, 165, 2);
  l.position.set(0, 0, 20);
  field.add(l); blastLights.push(l);
}
let blastIdx = 0;
function blastLight(x, y, color, power) {
  if (quality === 0) return;
  const l = blastLights[blastIdx++ % blastLights.length];
  l.color.set(color);
  l.intensity = power;
  l.position.set(lx(x), ly(y), 15);
}

/* ---- screen-space punch ---- */
function shockwave(x, y, amp) {
  const s = toScreen(lx(x), ly(y), 6);
  shockX = s.x / W; shockY = 1 - s.y / H;
  shockT = 0; shockAmp = amp;
}
function screenFlash(color, amt) { flashCol.set(color); flashAmt = Math.max(flashAmt, amt); }

/* ---- HUD 2D overlay ---- */
const hud = document.getElementById('hud');
const hctx = hud.getContext('2d');

function qPixelRatio() {
  const dpr = window.devicePixelRatio || 1;
  return quality >= 2 ? Math.min(dpr, 2) : quality === 1 ? Math.min(dpr, 1.5) : 1;
}
function onResize() {
  W = window.innerWidth; H = window.innerHeight;
  renderer.setPixelRatio(qPixelRatio());
  renderer.setSize(W, H);
  composer.setSize(W, H);
  bloom.setSize(W, H);
  camera.aspect = W / H; camera.updateProjectionMatrix();
  const dpr = Math.min(window.devicePixelRatio, 2);
  hud.width = W * dpr; hud.height = H * dpr;
  hud.style.width = W + 'px'; hud.style.height = H + 'px';
  hctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', onResize);

/* Tier 2 is the full show; 1 trims resolution and grain; 0 strips the extra
   pass entirely so a weak GPU still gets a smooth board. */
function applyQuality() {
  renderer.setPixelRatio(qPixelRatio());
  renderer.setSize(W, H);
  composer.setSize(W, H);
  bloom.strength = quality >= 2 ? 0.42 : quality === 1 ? 0.34 : 0.26;
  fxPass.enabled = quality > 0;
  fxPass.uniforms.uAberr.value = quality >= 2 ? 0.0011 : 0.0007;
  fxPass.uniforms.uGrain.value = quality >= 2 ? 0.035 : 0.020;
  if (dust) dust.visible = quality >= 1;
  if (quality === 0) for (const l of blastLights) l.intensity = 0;
}

let qWindow = 0, qFrames = 0, qCooldown = 0;
function sampleQuality(frameTime) {
  if (qualityPinned) return;
  qWindow += frameTime; qFrames++;
  if (qWindow < 1200) return;
  const avg = qWindow / qFrames;
  qWindow = 0; qFrames = 0;
  if (qCooldown > 0) { qCooldown--; return; }
  if      (avg > 26 && quality > 0) { quality--; applyQuality(); qCooldown = 3; }
  else if (avg < 14 && quality < 2) { quality++; applyQuality(); qCooldown = 6; }
}

onResize();
applyQuality();

const _v = new THREE.Vector3();
function toScreen(localX, localY, localZ) {
  _v.set(localX, localY, localZ);
  field.localToWorld(_v);
  _v.project(camera);
  return { x: (_v.x * 0.5 + 0.5) * W, y: (-_v.y * 0.5 + 0.5) * H, vis: _v.z < 1 };
}

/* ============================================================
   GAME LOGIC  (ported unchanged except render hooks)
   ============================================================ */
function togglePause() { if (running) paused = !paused; }

function startGame() {
  document.getElementById('overlay').classList.add('hidden');
  level = 1; score = 0; lives = 3;
  lifeIdx = 0; extraFlash = 0;
  puWide = 0; puSlow = 0; puMulti = false;
  puLaser = 0; puLaserLvl = 0; puCatch = 0; puPierce = 0; puShrink = 0; laserCd = 0;
  combo = 0; comboTimer = 0;
  lasers = []; popups = []; shake = 0;
  paused = false; _uiSig = '';
  initLevel();
  running = true;
  lastTime = 0; accumulator = 0;
}
document.getElementById('start-btn').addEventListener('click', () => { resumeAC(); startGame(); });

function paddleWidth() { return puShrink > 0 ? 58 : puWide > 0 ? 132 : 90; }
function setPaddleW() {
  const c = paddle.x + paddle.w / 2;
  paddle.w = paddleWidth();
  paddle.x = Math.max(0, Math.min(LW - paddle.w, c - paddle.w / 2));
}

function initLevel() {
  particles = []; drops = []; lasers = [];
  shards = []; rings = []; bombQueue = [];
  hitStop = 0; flashAmt = 0; shockT = 1;
  lvFlash = 100;
  const { map, extraHp } = buildLayout(level);
  const rows   = map.length;
  const cols   = Math.max(...map.map(r => r.length));
  const gap    = 1;
  const maxW   = LW - 24;
  const size   = Math.min((maxW - (cols - 1) * gap) / cols, 32);
  const gridW  = size * cols + gap * (cols - 1);
  const offX   = (LW - gridW) / 2;
  const offY   = 40;
  const baseHp = 1 + Math.floor((level - 1) / 7) + extraHp;

  bricks = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < map[r].length; c++) {
      const ch = map[r][c];
      if (ch === '.' || ch === ' ') continue;
      const fixed = ch === '#';
      const bomb  = ch === '*';
      const color = fixed ? '#445566' : bomb ? '#ff5a00' : (PX[ch] || '#00f5ff');
      // bombs stay cheap to pop — their value is the chain, not the grind
      const hp    = fixed ? 99 : bomb ? Math.min(baseHp, 2) : baseHp;
      bricks.push({
        x: offX + c * (size + gap), y: offY + r * (size + gap),
        w: size, h: size, color, glow: color,
        hp, maxHp: hp, alive: true, fixed, bomb, flash: 0,
        // wall assembles itself on level start: staggered from the centre outward
        anim: 0, delay: Math.round(r * 2.5 + Math.abs(c - cols / 2) * 1.8),
        bob: Math.random() * Math.PI * 2, queued: false
      });
    }
  }
  const pw = paddleWidth();
  paddle = { x: LW / 2 - pw / 2, y: LH - 34, w: pw, h: 10 };
  balls = [makeBall(ballSpeed(), true)];
  buildBrickMeshes();
  updateUI();
}

function makeBall(spd, stuck = false) {
  if (stuck) {
    return { x: paddle ? paddle.x + paddle.w / 2 : LW / 2, y: LH - 50, r: 6,
             vx: 0, vy: 0, stuck: true, off: 0, spd, trail: [] };
  }
  const ang = (Math.random() * 0.5 - 0.25) * Math.PI;
  return { x: LW / 2, y: LH - 100, r: 6,
           vx: Math.sin(ang) * spd, vy: -Math.cos(ang) * spd,
           stuck: false, off: 0, spd, trail: [] };
}
function launchAngleFor(b) {
  const rel = Math.max(-0.9, Math.min(0.9, b.off / (paddle.w / 2)));
  return rel !== 0 ? rel * 60 * Math.PI / 180 : (Math.random() * 0.3 - 0.15);
}
function launchStuck() {
  if (lvFlash > 30) return false;
  let launched = false;
  for (const b of balls) {
    if (!b.stuck) continue;
    const ang = launchAngleFor(b);
    const spd = b.spd || ballSpeed();
    b.vx = Math.sin(ang) * spd; b.vy = -Math.cos(ang) * spd;
    b.stuck = false; launched = true;
  }
  if (launched) SFX.paddle();
  return launched;
}

const elScore = document.getElementById('score-display');
const elLevelNum = document.getElementById('level-num');
let _uiSig = '';
function updateUI() {
  elScore.textContent = score;
  elLevelNum.textContent = level;
  // every brick break calls this — only touch the DOM when the pips or pills actually change
  const sig = lives + '|' + (puWide > 0) + (puSlow > 0) + puMulti + (puLaser > 0) +
              puLaserLvl + (puCatch > 0) + (puPierce > 0) + (puShrink > 0);
  if (sig === _uiSig) return;
  _uiSig = sig;
  const pips = document.getElementById('pips');
  pips.innerHTML = '';
  for (let i = 0; i < Math.min(lives, 10); i++) {
    const d = document.createElement('div'); d.className = 'life-pip'; pips.appendChild(d);
  }
  const row = document.getElementById('powerup-row');
  row.innerHTML = '';
  if (puWide   > 0) row.innerHTML += '<div class="pu-pill pu-wide">WIDE</div>';
  if (puSlow   > 0) row.innerHTML += '<div class="pu-pill pu-slow">SLOW</div>';
  if (puMulti)      row.innerHTML += '<div class="pu-pill pu-multi">MULTI</div>';
  if (puLaser  > 0) row.innerHTML += '<div class="pu-pill pu-laser">LASER' + (puLaserLvl >= 2 ? ' ×2' : '') + '</div>';
  if (puCatch  > 0) row.innerHTML += '<div class="pu-pill pu-catch">CATCH</div>';
  if (puPierce > 0) row.innerHTML += '<div class="pu-pill pu-pierce">PIERCE</div>';
  if (puShrink > 0) row.innerHTML += '<div class="pu-pill pu-shrink">SHRINK</div>';
}
function addScore(n) {
  score += n;
  let gained = false;
  while (lifeIdx < LIFE_THRESHOLDS.length && score >= LIFE_THRESHOLDS[lifeIdx]) {
    lifeIdx++; lives++; gained = true; extraFlash = 90; SFX.extra();
  }
  if (gained) updateUI();
  else document.getElementById('score-display').textContent = score;
}
function showOverlay(title, sub, btn) {
  document.getElementById('overlay-title').textContent = title;
  document.getElementById('overlay-sub').innerHTML     = sub;
  document.getElementById('start-btn').textContent     = btn;
  document.getElementById('hi-display').textContent    = hiScore;
  document.getElementById('best-display').textContent  = bestLevel;
  document.getElementById('overlay').classList.remove('hidden');
}
function spawnParticles(x, y, color, n = 12) {
  if (particles.length > 700) n = Math.ceil(n * 0.35);   // keep big chains from flooding the cloud
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 1.5 + Math.random() * 3.5;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 1, decay: 0.025 + Math.random() * 0.03, size: 2 + Math.random() * 3, color });
  }
}
const DROP_TABLE = [
  ['wide', 16], ['slow', 13], ['multi', 14], ['laser', 13],
  ['catch', 11], ['pierce', 10], ['shrink', 15], ['life', 8]
];
const DROP_COLORS = {
  wide:'#00ff88', slow:'#00f5ff', multi:'#ffe600', laser:'#ff006e',
  catch:'#bf00ff', pierce:'#ff6a00', life:'#f5f9ff', shrink:'#ff3344'
};
const DROP_LABELS = { wide:'W', slow:'S', multi:'M', laser:'L', catch:'C', pierce:'P', life:'+', shrink:'−' };
function pickDrop() {
  let r = Math.random() * 100;
  for (const [t, w] of DROP_TABLE) { if ((r -= w) < 0) return t; }
  return 'wide';
}
function spawnDrop(x, y) {
  const type = pickDrop();
  drops.push({ x, y, vy: 1.56, type, color: DROP_COLORS[type], label: DROP_LABELS[type], alive: true, t: 0, roll: 0 });
}
function applyDrop(type) {
  if (type === 'wide')        { puWide = 600; puShrink = 0; setPaddleW(); SFX.powerup(); }
  else if (type === 'slow')   { puSlow = 500; SFX.powerup(); }
  else if (type === 'multi')  { puMulti = true; const spd = ballSpeed(); for (let i = 0; i < 2; i++) balls.push(makeBall(spd)); SFX.powerup(); }
  else if (type === 'laser')  { puLaser = 540; laserCd = 0; puLaserLvl = Math.min(2, puLaserLvl + 1); SFX.powerup(); }
  else if (type === 'catch')  { puCatch = 720; SFX.powerup(); }
  else if (type === 'pierce') { puPierce = 420; SFX.powerup(); }
  else if (type === 'shrink') { puShrink = 480; puWide = 0; setPaddleW(); SFX.bad(); }
  else if (type === 'life')   { if (lives < 10) { lives++; extraFlash = 90; SFX.extra(); } else addScore(100); SFX.powerup(); }
}
// A chain can retire twenty bricks in one step; without a cap the cues stack into mush.
let breaksThisStep = 0;

function damageBrick(br) {
  br.hp--; br.flash = 1;
  const cx = br.x + br.w / 2, cy = br.y + br.h / 2;
  if (br.hp <= 0) {
    br.alive = false; combo++; comboTimer = 110;
    const mult = combo >= 5 ? 5 : combo >= 3 ? 3 : combo >= 2 ? 2 : 1;
    const pts  = 10 * level * mult;
    addScore(pts);
    // a chain retires bricks faster than the eye can read separate numbers —
    // roll nearby popups into one running total instead of stacking them
    const near = popups.find(p => p.life > 0.5 && Math.abs(p.x - cx) < 85 && Math.abs(p.y - br.y) < 85);
    if (near) { near.val += pts; near.life = 1; near.color = br.color; }
    else popups.push({ x: cx, y: br.y, val: pts, life: 1, color: br.color });
    shake = Math.min(shake + 1.6, 6);
    if (breaksThisStep++ < 4) SFX.break(cx, combo);
    spawnParticles(cx, cy, br.color, 18);
    spawnShards(cx, cy, br.color, 9);
    ringBurst(cx, cy, br.color, br.w * SX * 1.6, 0.08);
    blastLight(cx, cy, br.color, 24);
    if (combo >= 4) hitStop = Math.min(hitStop + 14, 55);   // the streak gets to land
    if (Math.random() < 0.10) spawnDrop(cx, cy);
    if (br.bomb) explodeBomb(br);
    updateUI();
    return true;
  }
  if (breaksThisStep < 6) SFX.hit(cx);
  spawnParticles(cx, cy, br.color, 5);
  return false;
}

/* Bomb bricks clear their neighbourhood and light neighbouring bombs on a short fuse,
   so a well-placed hit unzips the wall in a readable cascade rather than one flat pop. */
function explodeBomb(br) {
  const cx = br.x + br.w / 2, cy = br.y + br.h / 2;
  // ~2.4 cells: reaches two bricks straight out and one diagonally, so bombs
  // laid two apart light each other and the level maps can compose real chains
  const R  = br.w * 2.4;
  SFX.boom(cx);
  shake   = Math.min(shake + 5.5, 13);
  hitStop = Math.min(hitStop + 55, 90);
  spawnShards(cx, cy, '#ff8a1a', 30, 2.1);
  spawnParticles(cx, cy, '#ffb300', 26);
  ringBurst(cx, cy, '#ff9a2a', R * SX * 2.3, 0.032);
  blastLight(cx, cy, 0xff7a00, 58);
  shockwave(cx, cy, 0.020);
  screenFlash('#ff8a2a', 0.13);
  for (const o of bricks) {
    if (!o.alive || o === br || o.fixed) continue;
    const dx = (o.x + o.w / 2) - cx, dy = (o.y + o.h / 2) - cy;
    if (dx * dx + dy * dy > R * R) continue;
    if (o.bomb) {
      if (!o.queued) { o.queued = true; bombQueue.push({ br: o, t: 7 + Math.floor(Math.random() * 7) }); }
    } else {
      o.hp = 1; damageBrick(o);
    }
  }
}

function update() {
  if (puWide   > 0) { puWide--;   if (puWide   === 0) { setPaddleW(); updateUI(); } }
  if (puShrink > 0) { puShrink--; if (puShrink === 0) { setPaddleW(); updateUI(); } }
  if (puSlow   > 0) { puSlow--;   if (puSlow   === 0) updateUI(); }
  if (puCatch  > 0) { puCatch--;  if (puCatch  === 0) updateUI(); }
  if (puPierce > 0) { puPierce--; if (puPierce === 0) updateUI(); }
  if (comboTimer > 0) comboTimer--; else combo = 0;
  if (lvFlash > 0) lvFlash--;
  if (extraFlash > 0) extraFlash--;
  breaksThisStep = 0;
  for (const br of bricks) {
    if (br.flash > 0) br.flash -= 0.07;
    if (br.anim < 1) { if (br.delay > 0) br.delay--; else br.anim = Math.min(1, br.anim + 0.055); }
  }

  // queued bombs go off on their fuse, which is what turns a hit into a cascade
  for (let i = bombQueue.length - 1; i >= 0; i--) {
    const q = bombQueue[i];
    if (--q.t > 0) continue;
    bombQueue.splice(i, 1);
    if (q.br.alive) { q.br.hp = 1; damageBrick(q.br); }
  }

  updateShards();
  updateRings();
  for (const l of blastLights) l.intensity = l.intensity > 0.05 ? l.intensity * 0.83 : 0;
  if (shockT < 1)  shockT  = Math.min(1, shockT + 0.042);
  if (flashAmt > 0) flashAmt = Math.max(0, flashAmt - 0.045);

  if (keyL) mouseX = Math.max(0,  mouseX - 11);
  if (keyR) mouseX = Math.min(LW, mouseX + 11);
  let tx = mouseX - paddle.w / 2;
  tx = Math.max(0, Math.min(LW - paddle.w, tx));
  paddle.x += (tx - paddle.x) * 0.18;

  if (puLaser > 0) {
    puLaser--;
    if (laserCd > 0) laserCd--;
    else {
      if (puLaserLvl >= 2) lasers.push({ x: paddle.x + 7, y: paddle.y }, { x: paddle.x + paddle.w - 7, y: paddle.y });
      else                 lasers.push({ x: paddle.x + paddle.w / 2, y: paddle.y });
      laserCd = 15; SFX.laser(paddle.x + paddle.w / 2);
    }
    if (puLaser === 0) { puLaserLvl = 0; updateUI(); }
  }
  for (let i = lasers.length - 1; i >= 0; i--) {
    const l = lasers[i];
    l.y -= 9.5;
    let dead = l.y < -12;
    for (const br of bricks) {
      if (!br.alive) continue;
      if (l.x >= br.x && l.x <= br.x + br.w && l.y >= br.y && l.y <= br.y + br.h) {
        dead = true;
        if (br.fixed) { SFX.wall(l.x); spawnParticles(l.x, br.y + br.h, '#445566', 3); }
        else damageBrick(br);
        break;
      }
    }
    if (dead) lasers.splice(i, 1);
  }

  const slowMult = puSlow > 0 ? 0.58 : 1;
  for (let bi = balls.length - 1; bi >= 0; bi--) {
    const b = balls[bi];
    if (b.stuck) {
      b.x = paddle.x + paddle.w / 2 + b.off;
      b.y = paddle.y - b.r - 1;
      b.trail.length = 0;
      continue;
    }
    b.trail.push({ x: b.x, y: b.y });
    while (b.trail.length > TRAIL_N - 1) b.trail.shift();
    b.x += b.vx * slowMult; b.y += b.vy * slowMult;
    if (b.x - b.r < 0)  { b.x = b.r;      b.vx =  Math.abs(b.vx); SFX.wall(b.x); }
    if (b.x + b.r > LW) { b.x = LW - b.r; b.vx = -Math.abs(b.vx); SFX.wall(b.x); }
    if (b.y - b.r < 0)  { b.y = b.r;      b.vy =  Math.abs(b.vy); SFX.wall(b.x); }

    if (b.vy > 0 &&
        b.y + b.r >= paddle.y && b.y - b.r <= paddle.y + paddle.h &&
        b.x >= paddle.x - 4   && b.x <= paddle.x + paddle.w + 4) {
      if (puCatch > 0) {
        b.spd   = Math.hypot(b.vx, b.vy); b.stuck = true;
        b.off   = Math.max(-paddle.w / 2 + b.r, Math.min(paddle.w / 2 - b.r, b.x - (paddle.x + paddle.w / 2)));
        b.vx = b.vy = 0; b.y = paddle.y - b.r - 1; SFX.catch(b.x);
      } else {
        const rel   = (b.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
        const angle = rel * 65 * Math.PI / 180;
        const spd   = Math.hypot(b.vx, b.vy);
        b.vx = Math.sin(angle) * spd; b.vy = -Math.abs(Math.cos(angle) * spd);
        b.y  = paddle.y - b.r; SFX.paddle(b.x);
        spawnParticles(b.x, paddle.y, '#00f5ff', 6);
        ringBurst(b.x, paddle.y, '#00f5ff', 20, 0.1);
      }
    }
    for (const br of bricks) {
      if (!br.alive) continue;
      const cx = Math.max(br.x, Math.min(b.x, br.x + br.w));
      const cy = Math.max(br.y, Math.min(b.y, br.y + br.h));
      const dx = b.x - cx, dy = b.y - cy;
      if (dx * dx + dy * dy >= b.r * b.r) continue;
      const phasing = !br.fixed && br.hp <= 1 && puPierce > 0;
      if (!phasing) {
        const ox = Math.min(b.x - br.x, br.x + br.w - b.x);
        const oy = Math.min(b.y - br.y, br.y + br.h - b.y);
        if (ox < oy) b.vx *= -1; else b.vy *= -1;
      }
      if (br.fixed) { SFX.wall(b.x); spawnParticles(br.x + br.w / 2, br.y + br.h / 2, '#445566', 4); }
      else damageBrick(br);
      if (!phasing) break;
    }
    // never let a bounce settle into a near-horizontal grind between the rails
    const speed = Math.hypot(b.vx, b.vy);
    if (speed > 0.01 && Math.abs(b.vy) < speed * 0.20) {
      b.vy = Math.sign(b.vy || -1) * speed * 0.20;
      b.vx = (Math.sign(b.vx) || 1) * Math.sqrt(Math.max(0, speed * speed - b.vy * b.vy));
    }
    if (b.y - b.r > LH) balls.splice(bi, 1);
  }

  if (balls.length === 0) {
    lives--; shake = 8;
    puLaser = 0; puLaserLvl = 0; puPierce = 0; lasers = [];
    updateUI();
    if (lives <= 0) {
      if (score > hiScore) hiScore = score;
      if (level > bestLevel) bestLevel = level;
      saveHi();
      SFX.over();
      shockwave(LW / 2, LH - 30, 0.03);          // centres the flash where the ball was lost
      screenFlash('#ff006e', 0.28);
      showOverlay('GAME OVER',
        'Score: ' + score + ' · Reached level ' + level + ' — ' + LEVEL_NAMES[(level - 1) % LEVEL_NAMES.length],
        'RETRY');
      running = false; return;
    }
    SFX.life();
    combo = 0; puMulti = false;
    balls = [makeBall(ballSpeed(), true)];
    updateUI();
  }

  if (bricks.every(b => !b.alive || b.fixed)) {
    SFX.level(); addScore(level * 100); level++;
    if (level > bestLevel) { bestLevel = level; saveHi(); }
    screenFlash('#9ff4ff', 0.30);
    shockwave(LW / 2, LH / 2, 0.026);
    puWide = 0; puSlow = 0; puMulti = false;
    puLaser = 0; puLaserLvl = 0; puCatch = 0; puPierce = 0; puShrink = 0;
    initLevel(); return;
  }

  for (const d of drops) {
    if (!d.alive) continue;
    d.y += d.vy; d.t += 0.12; d.roll += 0.16;
    if (d.y > paddle.y && d.y < paddle.y + paddle.h + 12 &&
        d.x > paddle.x - 10 && d.x < paddle.x + paddle.w + 10) {
      d.alive = false; applyDrop(d.type);
      spawnParticles(d.x, d.y, d.color, 20); updateUI();
    }
    if (d.y > LH) d.alive = false;
  }
  drops = drops.filter(d => d.alive);

  if (puMulti && balls.length <= 1) { puMulti = false; updateUI(); }

  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.life -= p.decay; }
  particles = particles.filter(p => p.life > 0);
  for (const pp of popups) { pp.y -= 0.7; pp.life -= 0.022; }
  popups = popups.filter(p => p.life > 0);
}

/* ============================================================
   3D RENDER SYNC
   ============================================================ */
const _tmpCol = new THREE.Color();
const _trailPts = new Float32Array(TRAIL_N * 2);

// Post-stack state that both the gameplay and idle-menu render paths need.
function syncFX() {
  const u = fxPass.uniforms;
  u.uTime.value      = performance.now() * 0.001;
  u.uShockT.value    = shockT;
  u.uShockAmp.value  = shockAmp;
  u.uShockPos.value.set(shockX, shockY);
  u.uFlash.value     = flashAmt;
  u.uFlashCol.value.copy(flashCol);
  u.uAspect.value    = camera.aspect;
}

function render3D() {
  if (!paddle) return;

  // paddle (glass pill)
  const pcx = paddle.x + paddle.w / 2;
  const worldW = paddle.w * SX;
  if (Math.abs(worldW - _paddleGeoW) > 0.01) buildPaddleGeo(worldW);
  const px = lx(pcx), py = ly(paddle.y + paddle.h / 2);
  paddleMesh.position.set(px, py, PADDLE_Z);
  paddleCore.position.set(px, py, PADDLE_Z);
  paddleTick.position.set(px, py, PADDLE_Z);
  paddleLight.position.set(px, ly(paddle.y), 18);
  const st = puShrink > 0 ? 0 : puWide > 0 ? 2 : 1;        // 0 small · 1 normal · 2 wide
  paddleCoreMat.emissive.set(PADDLE_TINT[st]);
  paddleCoreMat.emissiveIntensity = PADDLE_CORE_GLOW[st];
  paddleMat.emissiveIntensity     = PADDLE_SHELL_GLOW[st];
  paddleLight.intensity           = PADDLE_LIGHT[st];
  paddleMat.attenuationColor.set(PADDLE_ATTEN[st]);

  // bricks — the wall assembles itself on level start, then breathes; bomb cores pulse
  const tNow = performance.now();
  for (const br of bricks) {
    const o = br.obj; if (!o) continue;
    const on = br.alive && br.anim > 0;
    o.mesh.visible = o.edge.visible = on;
    if (o.core) o.core.visible = o.coreHalo.visible = on;
    if (!on) continue;
    const a = br.anim;
    // easeOutBack — the brick overshoots and settles, so the wall lands with weight
    const e = a >= 1 ? 1 : 1 + 2.70158 * Math.pow(a - 1, 3) + 1.70158 * Math.pow(a - 1, 2);
    const z = o.baseZ + Math.sin(tNow * 0.0016 + br.bob) * 0.8 - (1 - a) * 110;
    o.mesh.position.z = o.edge.position.z = z;
    o.mesh.scale.setScalar(e); o.edge.scale.setScalar(e);
    const dim = br.hp < br.maxHp ? 0.45 : 1;
    o.mat.opacity = dim * a;
    o.mat.emissiveIntensity = 0.9 + (br.flash > 0 ? br.flash * 2.0 : 0);
    o.edge.material.opacity = (0.4 + 0.55 * dim) * a;
    if (o.core) {
      const pulse = 0.5 + 0.5 * Math.sin(tNow * 0.006 + br.bob);
      o.core.position.z = o.coreHalo.position.z = z + 4.6;
      o.core.material.emissiveIntensity = 1.6 + pulse * 2.6;
      o.core.scale.setScalar(e * (0.88 + pulse * 0.24));
      o.coreHalo.material.opacity = (0.30 + pulse * 0.34) * a;
    }
  }

  // balls + trails
  for (let i = 0; i < ballMeshes.length; i++) {
    if (i < balls.length) ballMeshes[i].mesh.visible = ballMeshes[i].trail.visible = true;
    else { ballMeshes[i].mesh.visible = ballMeshes[i].trail.visible = false; ballMeshes[i].light.visible = false; }
  }
  for (let i = 0; i < balls.length; i++) {
    const b = balls[i], o = ensureBall(i);
    o.mesh.visible = true; o.light.visible = true;
    o.mesh.position.set(lx(b.x), ly(b.y), 4.5);
    const pierce = puPierce > 0;
    const bcol = pierce ? 0x00ff88 : 0xffe600;
    o.mat.emissive.set(bcol);
    o.light.color.set(bcol);
    o.halo.material.color.set(bcol);

    // comet ribbon: samples widen and brighten toward the head
    const tn = b.trail.length + 1;                     // trail samples plus the ball itself
    if (tn > 1) {
      for (let k = 0; k < tn; k++) {
        const s = k < b.trail.length ? b.trail[k] : b;
        _trailPts[k * 2]     = lx(s.x);
        _trailPts[k * 2 + 1] = ly(s.y);
      }
      const pos = o.trail.geometry.attributes.position.array;
      const col = o.trail.geometry.attributes.color.array;
      _tmpCol.set(bcol);
      for (let k = 0; k < tn; k++) {
        const px = _trailPts[k * 2], py = _trailPts[k * 2 + 1];
        const ai = Math.max(0, k - 1), bi2 = Math.min(tn - 1, k + 1);
        let dx = _trailPts[bi2 * 2] - _trailPts[ai * 2];
        let dy = _trailPts[bi2 * 2 + 1] - _trailPts[ai * 2 + 1];
        const len = Math.hypot(dx, dy) || 1;
        const nx = -dy / len, ny = dx / len;           // perpendicular in the field plane
        const f = (k + 1) / tn;
        const w = TRAIL_W * f * (0.32 + 0.68 * f);   // pointed tail, full-bodied head
        const o0 = k * 6, o1 = o0 + 3;
        pos[o0] = px + nx * w; pos[o0+1] = py + ny * w; pos[o0+2] = 4.5;
        pos[o1] = px - nx * w; pos[o1+1] = py - ny * w; pos[o1+2] = 4.5;
        const g = f * f * 0.85;
        col[o0] = col[o1] = _tmpCol.r * g;
        col[o0+1] = col[o1+1] = _tmpCol.g * g;
        col[o0+2] = col[o1+2] = _tmpCol.b * g;
      }
      o.trail.geometry.setDrawRange(0, (tn - 1) * 6);
      o.trail.geometry.attributes.position.needsUpdate = true;
      o.trail.geometry.attributes.color.needsUpdate = true;
    }
    o.trail.visible = tn > 1;
  }

  // shard debris — one instanced draw for the whole cloud
  let sc = 0;
  for (const s of shards) {
    _dummy.position.set(lx(s.x), ly(s.y), s.z);
    _dummy.rotation.set(s.rx, s.ry, s.rz);
    _dummy.scale.setScalar(s.size * Math.min(1, s.life * 1.7));
    _dummy.updateMatrix();
    shardMesh.setMatrixAt(sc, _dummy.matrix);
    const f = Math.min(1, s.life * 1.5);
    _tmpCol.setRGB(s.r * f, s.g * f, s.b * f);
    shardMesh.setColorAt(sc, _tmpCol);
    sc++;
  }
  shardMesh.count = sc;
  shardMesh.instanceMatrix.needsUpdate = true;
  if (shardMesh.instanceColor) shardMesh.instanceColor.needsUpdate = true;

  // shockwave rings
  for (let i = 0; i < ringObjs.length; i++) ringObjs[i].mesh.visible = i < rings.length;
  for (let i = 0; i < rings.length; i++) {
    const r = rings[i], o = ensureRing(i);
    o.mesh.visible = true;
    const rad = 2 + r.maxR * r.t;
    o.mesh.position.set(lx(r.x), ly(r.y), 6.5);
    o.mesh.scale.set(rad, rad, 1);
    o.mat.color.set(r.color);
    o.mat.opacity = (1 - r.t) * (1 - r.t) * 0.9;
  }

  // drops as rolling cylinders
  for (let i = 0; i < dropObjs.length; i++) {
    if (i >= drops.length) { dropObjs[i].mesh.visible = dropObjs[i].spr.visible = false; }
  }
  for (let i = 0; i < drops.length; i++) {
    const d = drops[i], o = ensureDrop(i);
    o.mesh.visible = o.spr.visible = true;
    const X = lx(d.x), Y = ly(d.y);
    o.mesh.position.set(X, Y, 7);
    o.mesh.rotation.x = d.roll;
    o.mat.emissive.set(d.color);
    o.spr.position.set(X, Y - 14, 9);   // near side, facing the player as it rolls in
    if (o.sprMat.map?._label !== d.label) {
      o.sprMat.map = labelTexture(d.label, d.color);
      o.sprMat.map._label = d.label;
      o.sprMat.needsUpdate = true;
    }
  }

  // lasers
  for (let i = 0; i < laserMeshes.length; i++) laserMeshes[i].visible = i < lasers.length;
  for (let i = 0; i < lasers.length; i++) {
    const l = lasers[i], m = ensureLaser(i);
    m.visible = true; m.position.set(lx(l.x), ly(l.y), 5);
  }

  // particles
  let pc = 0;
  for (let i = 0; i < particles.length && pc < PMAX; i++) {
    const p = particles[i];
    pPos[pc*3] = lx(p.x); pPos[pc*3+1] = ly(p.y); pPos[pc*3+2] = 5;
    _tmpCol.set(p.color);
    const f = Math.max(0, p.life);
    pCol[pc*3] = _tmpCol.r * f; pCol[pc*3+1] = _tmpCol.g * f; pCol[pc*3+2] = _tmpCol.b * f;
    pc++;
  }
  pGeo.setDrawRange(0, pc);
  pGeo.attributes.position.needsUpdate = true;
  pGeo.attributes.color.needsUpdate = true;

  // paddle-follow camera — gentle & aspect-aware so both bottom corners always stay framed.
  const aspect    = camera.aspect;
  const narrow    = Math.max(0, 1 / Math.max(aspect, 0.34) - 1);   // grows as the screen gets more portrait
  const followAmt = THREE.MathUtils.clamp(aspect * 0.52, 0.30, 0.56);
  const baseZ     = 155 + narrow * 26;                              // closer on tall screens; the upright board still fits the width
  const restY     = 30 + narrow * 16 + Math.sin(performance.now() * 0.0006) * 0.7; // lift to look down the upright board
  const lookY     = -12 - narrow * 6;                               // tilt the gaze down only as the screen gets portrait
  const targetX   = lx(pcx) * followAmt;
  camera.position.x += (targetX - camera.position.x) * 0.10;
  camera.position.z += (baseZ - camera.position.z) * 0.08;
  if (shake > 0.1) {
    camera.position.x += (Math.random() - 0.5) * shake * 0.6;
    camera.position.y = restY + (Math.random() - 0.5) * shake * 0.6;
    shake *= 0.88;
  } else { camera.position.y += (restY - camera.position.y) * 0.1; shake = 0; }
  camera.lookAt(camera.position.x * 0.82, lookY, 15);             // view target lags the camera → keeps the field centred

  syncFX();
  composer.render();
}

/* ============================================================
   HUD OVERLAY  (screen-space text effects)
   ============================================================ */
function drawHUD() {
  hctx.clearRect(0, 0, W, H);

  // score popups (projected from brick positions)
  for (const pp of popups) {
    const s = toScreen(lx(pp.x), ly(pp.y), 8);
    if (!s.vis) continue;
    hctx.save();
    hctx.globalAlpha = Math.max(0, Math.min(1, pp.life * 1.4));
    hctx.fillStyle = pp.color;
    hctx.shadowBlur = 10; hctx.shadowColor = pp.color;
    // merged totals get bigger type, so a fat chain reads as a fat number
    hctx.font = 'bold ' + (pp.val >= 1000 ? 22 : pp.val >= 300 ? 18 : 15) + 'px Orbitron, monospace';
    hctx.textAlign = 'center'; hctx.textBaseline = 'bottom';
    hctx.fillText('+' + pp.val, s.x, s.y);
    hctx.restore();
  }

  if (combo >= 3 && comboTimer > 0) {
    hctx.save();
    hctx.globalAlpha = Math.min(comboTimer / 30, 1);
    hctx.fillStyle = '#ffe600'; hctx.shadowBlur = 20; hctx.shadowColor = '#ffe600';
    hctx.font = 'bold 22px Orbitron, monospace';
    hctx.textAlign = 'center'; hctx.textBaseline = 'middle';
    hctx.fillText('x' + Math.min(combo, 9) + ' COMBO', W / 2, H - 70);
    hctx.restore();
  }

  if (extraFlash > 0) {
    hctx.save();
    hctx.globalAlpha = Math.min(extraFlash / 30, 1);
    hctx.fillStyle = '#ff006e'; hctx.shadowBlur = 24; hctx.shadowColor = '#ff006e';
    hctx.font = 'bold 34px Orbitron, sans-serif';
    hctx.textAlign = 'center'; hctx.textBaseline = 'middle';
    hctx.fillText('EXTRA LIFE', W / 2, 120);
    hctx.restore();
  }

  if (lvFlash > 0) {
    const t = lvFlash / 100;
    const a = t < 0.2 ? t / 0.2 : t > 0.8 ? (1 - t) / 0.2 : 1;
    hctx.save();
    hctx.globalAlpha = a * 0.6;
    hctx.fillStyle = '#02040a'; hctx.fillRect(0, 0, W, H);
    hctx.globalAlpha = a;
    hctx.textAlign = 'center'; hctx.textBaseline = 'middle';
    hctx.shadowBlur = 40; hctx.shadowColor = '#00f5ff'; hctx.fillStyle = '#00f5ff';
    hctx.font = 'bold 64px Orbitron, sans-serif';
    hctx.fillText('LEVEL ' + level, W / 2, H / 2 - 30);
    hctx.shadowColor = '#00f5ff88'; hctx.fillStyle = '#00f5ffaa';
    hctx.font = '16px Share Tech Mono, monospace';
    hctx.fillText(LEVEL_NAMES[(level - 1) % LEVEL_NAMES.length], W / 2, H / 2 + 24);
    hctx.restore();
  }

  if (muted) {
    hctx.save();
    hctx.globalAlpha = 0.5; hctx.fillStyle = '#00f5ff';
    hctx.textAlign = 'center'; hctx.textBaseline = 'top';
    hctx.font = '11px Share Tech Mono, monospace';
    hctx.fillText('MUTED [M]', W / 2, 16);
    hctx.restore();
  }

  if (paused) {
    hctx.save();
    hctx.globalAlpha = 0.72; hctx.fillStyle = '#02040a'; hctx.fillRect(0, 0, W, H);
    hctx.globalAlpha = 1; hctx.textAlign = 'center'; hctx.textBaseline = 'middle';
    hctx.shadowBlur = 36; hctx.shadowColor = '#00f5ff'; hctx.fillStyle = '#00f5ff';
    hctx.font = 'bold 64px Orbitron, sans-serif';
    hctx.fillText('PAUSED', W / 2, H / 2 - 16);
    hctx.shadowColor = '#00f5ff88'; hctx.fillStyle = '#00f5ffaa';
    hctx.font = '14px Share Tech Mono, monospace';
    hctx.fillText('SPACE / P / DOUBLE-TAP TO RESUME', W / 2, H / 2 + 30);
    hctx.restore();
  }
}

/* ============================================================
   MAIN LOOP  (always renders; updates only while running)
   ============================================================ */
let idleSpin = 0;
function loop(now) {
  requestAnimationFrame(loop);
  if (now === undefined) now = performance.now();
  if (lastTime === 0) lastTime = now;
  let frameTime = now - lastTime;
  lastTime = now;
  if (frameTime > 250) frameTime = 250;
  sampleQuality(frameTime);

  if (floorTex) floorTex.offset.y = (floorTex.offset.y - frameTime * 0.00004) % 1;

  if (dust) {
    const p = dust.geometry.attributes.position.array;
    for (let i = 0; i < p.length; i += 3) {
      p[i+2] += frameTime * 0.012;                       // drift toward the camera
      p[i]   += Math.sin(now * 0.0003 + i) * 0.02;       // faint lateral sway
      if (p[i+2] > 165) {                                // recycle once past the camera
        p[i+2] -= 330;
        p[i]    = (Math.random() - 0.5) * 440;
        p[i+1]  = (Math.random() - 0.5) * 280 + 20;
      }
    }
    dust.geometry.attributes.position.needsUpdate = true;
  }

  if (running && !paused) {
    if (hitStop > 0) {
      // freeze the simulation for a few ms so a big hit reads as impact, not a blur
      hitStop -= frameTime;
      accumulator = 0;
    } else {
      accumulator += frameTime;
      let steps = 0;
      while (accumulator >= STEP && steps < 5) {
        update(); accumulator -= STEP; steps++;
        if (!running || hitStop > 0) break;
      }
      if (steps >= 5) accumulator = 0;
    }
  }

  if (running) { render3D(); drawHUD(); }
  else {
    // idle menu scene: slow camera drift over an empty tunnel
    idleSpin += frameTime * 0.0002;
    const narrow = Math.max(0, 1 / Math.max(camera.aspect, 0.34) - 1);
    camera.position.x = Math.sin(idleSpin) * 22;
    camera.position.y = 30 + narrow * 16;
    camera.position.z += (155 + narrow * 26 - camera.position.z) * 0.06;
    camera.lookAt(camera.position.x * 0.4, -12 - narrow * 6, 15);
    hctx.clearRect(0, 0, W, H);
    if (flashAmt > 0) flashAmt = Math.max(0, flashAmt - frameTime * 0.0018);
    syncFX();
    composer.render();
  }
}
requestAnimationFrame(loop);

/* ============================================================
   INPUT
   ============================================================ */
window.addEventListener('mousemove', e => { mouseX = (e.clientX / W) * LW; });
window.addEventListener('mousedown', () => { resumeAC(); if (running && !paused) launchStuck(); });
window.addEventListener('touchmove', e => {
  e.preventDefault(); mouseX = (e.touches[0].clientX / W) * LW;
}, { passive: false });
window.addEventListener('touchstart', e => {
  resumeAC();
  if (e.target.closest('.start-btn')) return;   // let the button handle it
  e.preventDefault();
  mouseX = (e.touches[0].clientX / W) * LW;
  if (!running) { startGame(); lastTap = 0; return; }
  const now = Date.now();
  if (now - lastTap < 300) { togglePause(); lastTap = 0; return; }
  lastTap = now;
  if (!paused) launchStuck();
}, { passive: false });
document.addEventListener('keydown', e => {
  if (e.code === 'ArrowLeft'  || e.code === 'KeyA') keyL = true;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keyR = true;
  if (e.code === 'KeyM') muted = !muted;
  if (e.code === 'KeyP') togglePause();
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault(); resumeAC();
    if (!running) startGame();
    else if (paused) togglePause();
    // a ball waiting on the paddle means "launch", even during the level intro —
    // pausing there was never what the player meant
    else if (!launchStuck() && !balls.some(b => b.stuck)) togglePause();
  }
});
document.addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft'  || e.code === 'KeyA') keyL = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keyR = false;
});
</script>
</body>
</html>
