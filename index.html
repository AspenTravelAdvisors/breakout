<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Breakout 3D — Neon Edition</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');
:root {
  --bg: #02040a;
  --neon-cyan: #00f5ff;
  --neon-pink: #ff006e;
  --neon-yellow: #ffe600;
  --neon-green: #00ff88;
  --glow-cyan: 0 0 8px #00f5ff, 0 0 20px #00f5ffaa, 0 0 40px #00f5ff44;
  --glow-pink: 0 0 8px #ff006e, 0 0 20px #ff006eaa, 0 0 40px #ff006e44;
  --glow-yellow: 0 0 8px #ffe600, 0 0 20px #ffe600aa;
  --glow-green: 0 0 8px #00ff88, 0 0 20px #00ff88aa;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden; background: var(--bg);
  font-family: 'Share Tech Mono', monospace; color: var(--neon-cyan);
  user-select: none; -webkit-user-select: none; touch-action: none;
}
#gl, #hud { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#gl  { z-index: 0; }
#hud { z-index: 1; pointer-events: none; }
/* soft cinematic vignette (no scanlines — they banded badly in perspective) */
#vignette {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background: radial-gradient(ellipse 92% 82% at 50% 43%, transparent 46%, #02040a8c 80%, #02040ae8 100%);
}

/* ---- floating HUD chrome ---- */
.hud-el { position: fixed; z-index: 2; pointer-events: none; }
#title-block { top: 16px; left: 20px; }
.title {
  font-family: 'Orbitron', sans-serif; font-weight: 900;
  font-size: clamp(15px, 2.4vw, 26px); letter-spacing: 5px;
  color: var(--neon-cyan); text-shadow: var(--glow-cyan); text-transform: uppercase;
}
#score-block { top: 16px; right: 22px; text-align: right; }
.stat-label { font-size: 9px; letter-spacing: 3px; color: #00f5ff77; text-transform: uppercase; }
.stat-value {
  font-family: 'Orbitron', sans-serif; font-size: clamp(18px, 3vw, 30px);
  font-weight: 700; color: var(--neon-yellow); text-shadow: var(--glow-yellow);
}
#lives-block { bottom: 18px; left: 20px; display: flex; gap: 8px; align-items: center; }
.lives-label { font-size: 9px; letter-spacing: 3px; color: #00f5ff66; text-transform: uppercase; margin-right: 2px; }
#pips { display: flex; gap: 7px; align-items: center; }
.life-pip {
  width: 22px; height: 7px; background: var(--neon-pink); box-shadow: var(--glow-pink);
  clip-path: polygon(4px 0%, 100% 0%, calc(100% - 4px) 100%, 0% 100%);
}
#level-display { margin-left: 14px; font-size: 9px; letter-spacing: 3px; color: #00f5ff66; text-transform: uppercase; }
#level-num { color: var(--neon-green); text-shadow: var(--glow-green); font-family: 'Orbitron', sans-serif; font-weight: 700; }
#powerup-row { bottom: 18px; right: 22px; display: flex; gap: 6px; align-items: center; min-height: 16px; }
.pu-pill {
  font-size: 8px; letter-spacing: 2px; padding: 3px 8px; border: 1px solid;
  text-transform: uppercase; font-family: 'Orbitron', sans-serif; font-weight: 700;
  background: #02040a99;
}
.pu-wide   { color: #00ff88; border-color: #00ff88; box-shadow: 0 0 6px #00ff8866; }
.pu-slow   { color: #00f5ff; border-color: #00f5ff; box-shadow: 0 0 6px #00f5ff66; }
.pu-multi  { color: #ffe600; border-color: #ffe600; box-shadow: 0 0 6px #ffe60066; }
.pu-laser  { color: #ff006e; border-color: #ff006e; box-shadow: 0 0 6px #ff006e66; }
.pu-catch  { color: #bf00ff; border-color: #bf00ff; box-shadow: 0 0 6px #bf00ff66; }
.pu-pierce { color: #ff6a00; border-color: #ff6a00; box-shadow: 0 0 6px #ff6a0066; }
.pu-shrink { color: #ff3344; border-color: #ff3344; box-shadow: 0 0 6px #ff334466; }

/* ---- start / game-over overlay ---- */
#overlay {
  position: fixed; inset: 0; z-index: 3;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: radial-gradient(circle at 50% 45%, #04122099, #02040af2 70%);
  transition: opacity 0.35s;
}
#overlay.hidden { opacity: 0; pointer-events: none; }
.overlay-title {
  font-family: 'Orbitron', sans-serif; font-weight: 900;
  font-size: clamp(26px, 9vw, 72px); letter-spacing: 8px;
  color: var(--neon-cyan); text-shadow: var(--glow-cyan);
  margin-bottom: 8px; text-align: center;
}
.overlay-sub {
  font-size: clamp(9px, 2.4vw, 12px); letter-spacing: 3px; color: #00f5ff88;
  margin-bottom: 30px; text-transform: uppercase; text-align: center;
  padding: 0 16px; line-height: 2.1;
}
.start-btn {
  font-family: 'Orbitron', sans-serif; font-weight: 700;
  font-size: clamp(11px, 3vw, 15px); letter-spacing: 4px;
  color: var(--bg); background: var(--neon-cyan); border: none;
  padding: 14px 40px; cursor: pointer; text-transform: uppercase;
  box-shadow: var(--glow-cyan); pointer-events: auto;
  clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
  transition: all 0.2s;
}
.start-btn:hover, .start-btn:active {
  background: var(--neon-pink); box-shadow: var(--glow-pink); transform: scale(1.06);
}
.hi-score-line { margin-top: 20px; font-size: 11px; letter-spacing: 3px; color: #00f5ff55; }
.hi-score-val { color: var(--neon-yellow); }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ============================================================
   LOGICAL GAME SPACE  (unchanged 2D physics: 480 x 560)
   ============================================================ */
const LW = 480, LH = 560;

/* ---------------- audio (high-quality headphone) ---------------- */
const AC = (() => {
  try { return new (window.AudioContext || window.webkitAudioContext)(); }
  catch(e) { return null; }
})();
let muted = false;

// Master chain: sources → masterOut → compressor → speakers
let masterOut, reverbIn;
(function initAudio() {
  if (!AC) return;
  masterOut = AC.createGain();
  masterOut.gain.value = 0.78;
  const comp = AC.createDynamicsCompressor();
  comp.threshold.value = -14; comp.knee.value = 8;
  comp.ratio.value = 5; comp.attack.value = 0.002; comp.release.value = 0.18;
  masterOut.connect(comp); comp.connect(AC.destination);

  // Procedural room reverb via convolution
  reverbIn = AC.createConvolver();
  const rate = AC.sampleRate, rLen = Math.floor(rate * 0.55);
  const ir = AC.createBuffer(2, rLen, rate);
  for (let c = 0; c < 2; c++) {
    const ch = ir.getChannelData(c);
    for (let i = 0; i < rLen; i++) ch[i] = (Math.random()*2-1) * Math.pow(1-i/rLen, 2.8);
  }
  reverbIn.buffer = ir;
  const rvbG = AC.createGain(); rvbG.gain.value = 0.15;
  reverbIn.connect(rvbG); rvbG.connect(masterOut);
})();

function xPan(x) { return Math.max(-1, Math.min(1, (x / LW) * 2 - 1)); }

function wireOut(node, pan, withReverb) {
  if (!masterOut) return;
  if (pan !== 0 && AC.createStereoPanner) {
    const p = AC.createStereoPanner(); p.pan.value = pan;
    node.connect(p); p.connect(masterOut);
    if (withReverb) p.connect(reverbIn);
  } else {
    node.connect(masterOut);
    if (withReverb) node.connect(reverbIn);
  }
}

// Soft attack by default keeps every cue click-free and gentle (ASMR).
function tone(freq, type, dur, vol = 0.15, startDelay = 0, pan = 0, reverb = false, atk = 0.012) {
  if (!AC || muted) return;
  try {
    const t = AC.currentTime + startDelay;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + Math.min(atk, dur * 0.5));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); wireOut(g, pan, reverb);
    o.start(t); o.stop(t + dur + 0.02);
  } catch(e) {}
}

function sweep(f0, f1, type, dur, vol = 0.12, startDelay = 0, pan = 0, reverb = false, atk = 0.012) {
  if (!AC || muted) return;
  try {
    const t = AC.currentTime + startDelay;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t);                          // soft swell, no hard transient
    g.gain.linearRampToValueAtTime(vol, t + Math.min(atk, dur * 0.5));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); wireOut(g, pan, reverb);
    o.start(t); o.stop(t + dur + 0.02);
  } catch(e) {}
}

// filterType 'lowpass' gives a warm, airy whisper; 'bandpass' a textured hiss.
function noise(dur, vol = 0.1, bandFreq = 800, startDelay = 0, pan = 0, q = 2, reverb = false, filterType = 'bandpass') {
  if (!AC || muted) return;
  try {
    const t = AC.currentTime + startDelay;
    const frames = Math.ceil(AC.sampleRate * dur);
    const buf = AC.createBuffer(2, frames, AC.sampleRate);
    for (let c = 0; c < 2; c++) {
      const ch = buf.getChannelData(c);
      for (let i = 0; i < frames; i++) ch[i] = Math.random()*2-1;
    }
    const src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    src.buffer = buf;
    f.type = filterType; f.frequency.value = bandFreq; f.Q.value = q;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + Math.min(0.008, dur * 0.5));  // softer onset
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); wireOut(g, pan, reverb);
    src.start(t);
  } catch(e) {}
}

const SFX = {
  // soft rounded "tok" off the walls
  wall: (x = LW/2) => {
    const p = xPan(x);
    noise(0.02, 0.045, 1400, 0, p, 0.8, false, 'lowpass');
    tone(680, 'sine', 0.05, 0.05, 0, p, false, 0.006);
  },
  // warm cushioned "thup" off the paddle
  paddle: (x = LW/2) => {
    const p = xPan(x);
    tone(120, 'sine', 0.11, 0.16, 0, p, true, 0.01);
    tone(240, 'sine', 0.07, 0.08, 0, p);
    noise(0.025, 0.04, 600, 0, p, 0.7, false, 'lowpass');
  },
  // gentle muted tap when a brick is only chipped
  hit: (x = LW/2) => {
    const p = xPan(x);
    noise(0.03, 0.05, 900, 0, p, 0.8, true, 'lowpass');
    tone(360, 'sine', 0.06, 0.06, 0, p, false, 0.008);
  },
  // soft, satisfying water-droplet "bloop" when a brick pops
  break: (x = LW/2) => {
    const p = xPan(x);
    sweep(560, 190, 'sine', 0.17, 0.13, 0, p, true);     // droplet glide
    tone(280, 'triangle', 0.12, 0.07, 0, p, true);       // warm body
    tone(840, 'sine', 0.08, 0.035, 0.004, p, true);      // faint sparkle
    tone(80,  'sine', 0.13, 0.09, 0, p, true);           // gentle sub
    noise(0.05, 0.035, 1000, 0, p, 0.7, true, 'lowpass'); // airy whisper
  },
  // breathy, airy "pew" rather than a buzzy zap
  laser: (x = LW/2) => {
    const p = xPan(x);
    sweep(1400, 520, 'sine',     0.10, 0.05,  0,     p, true);
    sweep(900,  360, 'triangle', 0.09, 0.035, 0.012, p);
    noise(0.06, 0.025, 1800, 0, p, 0.8, true, 'lowpass');
  },
  catch: (x = LW/2) => {
    const p = xPan(x);
    tone(700,  'sine', 0.14, 0.08, 0,    p, true, 0.02);
    tone(1050, 'sine', 0.16, 0.06, 0.04, p, true, 0.02);
    tone(1400, 'sine', 0.11, 0.04, 0.08, p, true, 0.02);
  },
  powerup: () => {
    [523,659,784,1047].forEach((f,i) => {
      tone(f,     'sine', 0.20, 0.12, i*0.07, 0, true, 0.02);
      tone(f*1.5, 'sine', 0.13, 0.035, i*0.07, 0, false, 0.02);
    });
  },
  bad: () => {
    [330,260,200].forEach((f,i) => sweep(f, f*0.65, 'triangle', 0.18, 0.10, i*0.09, 0, true));
  },
  life: () => {
    [360,280,210,150].forEach((f,i) => tone(f, 'triangle', 0.20, 0.11, i*0.12, 0, true, 0.02));
  },
  extra: () => {
    [523,784,1047,1319].forEach((f,i) => {
      tone(f,     'sine', 0.22, 0.12, i*0.06, 0, true, 0.02);
      tone(f*0.5, 'sine', 0.15, 0.045, i*0.06, 0, false, 0.02);
    });
  },
  level: () => {
    [523,659,784,880,1047].forEach((f,i) => {
      tone(f,     'sine',     0.24, 0.10, i*0.09, 0, true, 0.025);
      tone(f*1.5, 'triangle', 0.19, 0.035, i*0.09, 0, false, 0.025);
    });
  },
  over: () => {
    [280,220,180,140,100].forEach((f,i) => tone(f, 'triangle', 0.32, 0.12, i*0.2, 0, true, 0.03));
    noise(0.5, 0.03, 180, 0.6, 0, 0.5, true, 'lowpass');
  },
};
function resumeAC() { if (AC && AC.state === 'suspended') AC.resume(); }

/* ---------------- palette + levels (verbatim) ---------------- */
const PX = {
  r:'#ff006e', o:'#ff6a00', y:'#ffe600', g:'#00ff88',
  c:'#00f5ff', b:'#3a86ff', p:'#bf00ff', w:'#f5f9ff', m:'#ff5fd2'
};
const LEVEL_NAMES = [
  'INITIATE','PYRAMID','HEARTBEAT','INVADER','SMILE',
  'STARFALL','PRISM','SKULL','VOLTAGE','FORTRESS',
  'FUNGUS','PHANTOM','FELINE','LIFTOFF','ROYALTY',
  'SAUCER','ABYSS','LABYRINTH','PAPILLON','OMEGA'
];
const LEVEL_MAPS = [
  ['cccccccccc','gggggggggg','yyyyyyyyyy','oooooooooo'],
  ['.....c.....','....ccc....','...ccccc...','..ccccccc..','.ccccccccc.','ccccccccccc'],
  ['..rr...rr..','.rrrr.rrrr.','rrrrrrrrrrr','rrrrrrrrrrr','.rrrrrrrrr.','..rrrrrrr..','...rrrrr...','....rrr....','.....r.....'],
  ['..p.....p..','...p...p...','..ppppppp..','.pp.ppp.pp.','ppppppppppp','p.ppppppp.p','p.p.....p.p','...pp.pp...'],
  ['...yyyyy...','.yyyyyyyyy.','yyyyyyyyyyy','yyy.yyy.yyy','yyy.yyy.yyy','yyyyyyyyyyy','yyy.....yyy','.yyyyyyyyy.','...yyyyy...'],
  ['.....y.....','.....y.....','....yyy....','yyyyyyyyyyy','.yyyyyyyyy.','..yyyyyyy..','..yyy.yyy..','.yy.....yy.','.y.......y.'],
  ['.....c.....','....ccc....','...ccccc...','..ccccccc..','.ccccccccc.','ccccccccccc','.ccccccccc.','..ccccccc..','...ccccc...','....ccc....','.....c.....'],
  ['..wwwwwww..','.wwwwwwwww.','wwwwwwwwwww','ww..www..ww','ww..www..ww','wwwww.wwwww','.wwwwwwwww.','.w.w.w.w.w.'],
  ['......yyy..','.....yyy...','....yyy....','..yyyyyyy..','....yyy....','...yyy.....','..yyy......','.yyy.......'],
  ['###########','#ccccccccc#','#cyyyyyyyc#','#cyrrrrryc#','#cyyyyyyyc#','#ccccccccc#','###########'],
  ['...rrrrr...','..rrwwwrr..','.rrwwwwwrr.','rrwwrrrwwrr','rrrrrrrrrrr','...wwwww...','...wwwww...','...wwwww...'],
  ['...ppppp...','..ppppppp..','.ppppppppp.','.pwwpppwwp.','.pwwpppwwp.','.ppppppppp.','.ppppppppp.','.p.p.p.p.p.'],
  ['gg.......gg','ggg.....ggg','ggggggggggg','gg.ggggg.gg','ggggggggggg','ggggg.ggggg','ggggggggggg','.ggggggggg.'],
  ['.....r.....','....rrr....','....ccc....','...rrrrr...','...rrrrr...','...rrrrr...','..rrrrrrr..','.rr.rrr.rr.','o..o.o.o..o'],
  ['y....y....y','yy..yyy..yy','yyyyyyyyyyy','yyryyyyyryy','yyyyyyyyyyy'],
  ['...ggggg...','..ggggggg..','.ggggggggg.','ccccccccccc','cycycycycyc'],
  ['......ccc..','c...cccccc.','cc.cccccccc','ccccccc.ccc','cc.cccccccc','c...cccccc.','......ccc..'],
  ['#.#.#.#.#.#','.r.r.r.r.r.','#.#.#.#.#.#','.g.g.g.g.g.','#.#.#.#.#.#','.y.y.y.y.y.','#.#.#.#.#.#'],
  ['pp.......pp','ppp.....ppp','pppp.y.pppp','pppppyppppp','pppp.y.pppp','ppp.....ppp','pp.......pp'],
  ['###.....###','#rrrrrrrrr#','rr.rrrrr.rr','rrr.rrr.rrr','rrrrrrrrrrr','r.r.r.r.r.r','rrrrrrrrrrr','#rrrrrrrrr#']
];
function ballSpeed() { return Math.min(5.028 + level * 0.48, 13.2); }
function buildLayout(level) {
  const map     = LEVEL_MAPS[(level - 1) % LEVEL_MAPS.length];
  const extraHp = Math.floor((level - 1) / LEVEL_MAPS.length);
  return { map, extraHp };
}

/* ---------------- game state ---------------- */
let score, hiScore = 0, lives, level;
try { hiScore = +localStorage.getItem('bevvip_breakout_hi') || 0; } catch(e) {}
let bricks, balls, paddle, particles, drops, lasers = [], popups = [];
let running = false, paused = false;
let mouseX = LW / 2;
let keyL = false, keyR = false;
let lastTap = 0;
const STEP = 1000 / 60;
let lastTime = 0, accumulator = 0;
let combo = 0, comboTimer = 0;
let puWide = 0, puSlow = 0, puMulti = false;
let puLaser = 0, puCatch = 0, puPierce = 0, puShrink = 0, laserCd = 0;
let puLaserLvl = 0;   // 0 none · 1 single centre cannon · 2 twin side cannons
let shake = 0;
let lvFlash = 0;
const LIFE_THRESHOLDS = [5000, 15000, 30000, 50000];
let lifeIdx = 0, extraFlash = 0;

document.getElementById('hi-display').textContent = hiScore;
function saveHi() { try { localStorage.setItem('bevvip_breakout_hi', hiScore); } catch(e) {} }

/* ============================================================
   3D SCENE
   ============================================================ */
const FW = 120;          // world width that spans LW
const FH = 250;          // world length down the ramp that spans LH
const SX = FW / LW;      // game-x  -> local-x
const SY = FH / LH;      // game-y  -> local-y (down ramp)
const lx = gx => (gx / LW - 0.5) * FW;
const ly = gy => (0.5 - gy / LH) * FH;

let W = window.innerWidth, H = window.innerHeight;
const glCanvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050d1c, 0.0028);

// soft IBL environment, applied only to the glass paddle so the neon bricks keep their flat glow
const ENV_TEX = (() => {
  const pmrem = new THREE.PMREMGenerator(renderer);
  return pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
})();

// soft radial glow sprite texture, reused for ball halos + atmosphere
const glowTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.35, 'rgba(255,255,255,0.45)');
  grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
})();

const camera = new THREE.PerspectiveCamera(80, W / H, 0.1, 2000);
camera.position.set(0, 30, 158);
camera.lookAt(0, -12, 15);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.42, 0.5, 0.76);
composer.addPass(bloom);
composer.addPass(new OutputPass());

scene.add(new THREE.AmbientLight(0x3a5a7a, 0.7));

let floorTex;
(function buildFloor() {
  const S = 512;
  const c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  g.fillStyle = '#040f1d'; g.fillRect(0, 0, S, S);
  // depth lanes (vertical in texture → converge to the vanishing point): bright with glow
  g.shadowColor = '#16d8ff'; g.shadowBlur = 9;
  g.fillStyle = 'rgba(36,210,242,0.9)';

  g.shadowBlur = 4; g.fillStyle = 'rgba(36,210,242,0.22)';
  g.fillRect(0, 0, S, 2);
  floorTex = new THREE.CanvasTexture(c);
  floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
  floorTex.repeat.set(12, 15);
  floorTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  floorTex.minFilter = THREE.LinearMipmapLinearFilter; floorTex.generateMipmaps = true;

/* ---- brick meshes (rebuilt each level) ---- */
const brickObjs = [];
function clearBricks() {
  for (const o of brickObjs) {
    field.remove(o.mesh); field.remove(o.edge);
    o.mesh.geometry.dispose(); o.mesh.material.dispose();
    o.edge.geometry.dispose(); o.edge.material.dispose();
  }
  brickObjs.length = 0;
}
function buildBrickMeshes() {
  clearBricks();
  for (const br of bricks) {
    const w = br.w * SX, h = br.h * SY, d = 8;
    const radius = Math.min(w, h, d) * 0.22;
    const geo = new RoundedBoxGeometry(w, h, d, 4, radius);
    const col = new THREE.Color(br.color);
    const mat = new THREE.MeshStandardMaterial({
      color: col.clone().multiplyScalar(0.25),
      emissive: col, emissiveIntensity: 0.95,
      roughness: br.fixed ? 0.8 : 0.35, metalness: br.fixed ? 0.7 : 0.3,
      transparent: true, opacity: 1
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(lx(br.x + br.w / 2), ly(br.y + br.h / 2), d / 2 + 0.5);
    // crisp neon outline (sharp box, sized just inside the rounded face) keeps bricks readable & separated
    const edge = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.BoxGeometry(w - radius, h - radius, d - radius)),
      new THREE.LineBasicMaterial({ color: col, transparent: true, opacity: 0.9 })
    );
    edge.position.copy(mesh.position);
    field.add(mesh); field.add(edge);
    br.obj = { mesh, edge, mat };
    brickObjs.push(br.obj);
  }
}

/* ============================================================
   GAME LOGIC  (ported unchanged except render hooks)
   ============================================================ */
function togglePause() { if (running) paused = !paused; }

function startGame() {
  document.getElementById('overlay').classList.add('hidden');
  level = 1; score = 0; lives = 3;
  lifeIdx = 0; extraFlash = 0;
  puWide = 0; puSlow = 0; puMulti = false;
  puLaser = 0; puLaserLvl = 0; puCatch = 0; puPierce = 0; puShrink = 0; laserCd = 0;
  combo = 0; comboTimer = 0;
  lasers = []; popups = []; shake = 0;
  paused = false;
  initLevel();
  running = true;
  lastTime = 0; accumulator = 0;
}
document.getElementById('start-btn').addEventListener('click', () => { resumeAC(); startGame(); });

function paddleWidth() { return puShrink > 0 ? 58 : puWide > 0 ? 132 : 90; }
function setPaddleW() {
  const c = paddle.x + paddle.w / 2;
  paddle.w = paddleWidth();
  paddle.x = Math.max(0, Math.min(LW - paddle.w, c - paddle.w / 2));
}

function initLevel() {
  particles = []; drops = []; lasers = [];
  lvFlash = 100;
  const { map, extraHp } = buildLayout(level);
  const rows   = map.length;
  const cols   = Math.max(...map.map(r => r.length));
  const gap    = 3;
  const maxW   = LW - 24;
  const size   = Math.min((maxW - (cols - 1) * gap) / cols, 32);
  const gridW  = size * cols + gap * (cols - 1);
  const offX   = (LW - gridW) / 2;
  const offY   = 40;
  const baseHp = 1 + Math.floor((level - 1) / 7) + extraHp;

  bricks = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < map[r].length; c++) {
      const ch = map[r][c];
      if (ch === '.' || ch === ' ') continue;
      const fixed = ch === '#';
      const color = fixed ? '#445566' : (PX[ch] || '#00f5ff');
      const hp    = fixed ? 99 : baseHp;
      bricks.push({
        x: offX + c * (size + gap), y: offY + r * (size + gap),
        w: size, h: size, color, glow: color,
        hp, maxHp: hp, alive: true, fixed, flash: 0
      });
    }
  }
  const pw = paddleWidth();
  paddle = { x: LW / 2 - pw / 2, y: LH - 34, w: pw, h: 10 };
  balls = [makeBall(ballSpeed(), true)];
  buildBrickMeshes();
  updateUI();
}

function makeBall(spd, stuck = false) {
  if (stuck) {
    return { x: paddle ? paddle.x + paddle.w / 2 : LW / 2, y: LH - 50, r: 6,
             vx: 0, vy: 0, stuck: true, off: 0, spd, trail: [] };
  }
  const ang = (Math.random() * 0.5 - 0.25) * Math.PI;
  return { x: LW / 2, y: LH - 100, r: 6,
           vx: Math.sin(ang) * spd, vy: -Math.cos(ang) * spd,
           stuck: false, off: 0, spd, trail: [] };
}
function launchAngleFor(b) {
  const rel = Math.max(-0.9, Math.min(0.9, b.off / (paddle.w / 2)));
  return rel !== 0 ? rel * 60 * Math.PI / 180 : (Math.random() * 0.3 - 0.15);
}
function launchStuck() {
  if (lvFlash > 30) return false;
  let launched = false;
  for (const b of balls) {
    if (!b.stuck) continue;
    const ang = launchAngleFor(b);
    const spd = b.spd || ballSpeed();
    b.vx = Math.sin(ang) * spd; b.vy = -Math.cos(ang) * spd;
    b.stuck = false; launched = true;
  }
  if (launched) SFX.paddle();
  return launched;
}

function updateUI() {
  document.getElementById('score-display').textContent = score;
  document.getElementById('level-num').textContent     = level;
  const pips = document.getElementById('pips');
  pips.innerHTML = '';
  for (let i = 0; i < Math.min(lives, 10); i++) {
    const d = document.createElement('div'); d.className = 'life-pip'; pips.appendChild(d);
  }
  const row = document.getElementById('powerup-row');
  row.innerHTML = '';
  if (puWide   > 0) row.innerHTML += '<div class="pu-pill pu-wide">WIDE</div>';
  if (puSlow   > 0) row.innerHTML += '<div class="pu-pill pu-slow">SLOW</div>';
  if (puMulti)      row.innerHTML += '<div class="pu-pill pu-multi">MULTI</div>';
  if (puLaser  > 0) row.innerHTML += '<div class="pu-pill pu-laser">LASER' + (puLaserLvl >= 2 ? ' ×2' : '') + '</div>';
  if (puCatch  > 0) row.innerHTML += '<div class="pu-pill pu-catch">CATCH</div>';
  if (puPierce > 0) row.innerHTML += '<div class="pu-pill pu-pierce">PIERCE</div>';
  if (puShrink > 0) row.innerHTML += '<div class="pu-pill pu-shrink">SHRINK</div>';
}
function addScore(n) {
  score += n;
  let gained = false;
  while (lifeIdx < LIFE_THRESHOLDS.length && score >= LIFE_THRESHOLDS[lifeIdx]) {
    lifeIdx++; lives++; gained = true; extraFlash = 90; SFX.extra();
  }
  if (gained) updateUI();
  else document.getElementById('score-display').textContent = score;
}
function showOverlay(title, sub, btn) {
  document.getElementById('overlay-title').textContent = title;
  document.getElementById('overlay-sub').innerHTML     = sub;
  document.getElementById('start-btn').textContent     = btn;
  document.getElementById('hi-display').textContent    = hiScore;
  document.getElementById('overlay').classList.remove('hidden');
}
function spawnParticles(x, y, color, n = 12) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 1.5 + Math.random() * 3.5;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 1, decay: 0.025 + Math.random() * 0.03, size: 2 + Math.random() * 3, color });
  }
}
const DROP_TABLE = [
  ['wide', 16], ['slow', 13], ['multi', 14], ['laser', 13],
  ['catch', 11], ['pierce', 10], ['shrink', 15], ['life', 8]
];
const DROP_COLORS = {
  wide:'#00ff88', slow:'#00f5ff', multi:'#ffe600', laser:'#ff006e',
  catch:'#bf00ff', pierce:'#ff6a00', life:'#f5f9ff', shrink:'#ff3344'
};
const DROP_LABELS = { wide:'W', slow:'S', multi:'M', laser:'L', catch:'C', pierce:'P', life:'+', shrink:'−' };
function pickDrop() {
  let r = Math.random() * 100;
  for (const [t, w] of DROP_TABLE) { if ((r -= w) < 0) return t; }
  return 'wide';
}
function spawnDrop(x, y) {
  const type = pickDrop();
  drops.push({ x, y, vy: 1.56, type, color: DROP_COLORS[type], label: DROP_LABELS[type], alive: true, t: 0, roll: 0 });
}
function applyDrop(type) {
  if (type === 'wide')        { puWide = 600; puShrink = 0; setPaddleW(); SFX.powerup(); }
  else if (type === 'slow')   { puSlow = 500; SFX.powerup(); }
  else if (type === 'multi')  { puMulti = true; const spd = ballSpeed(); for (let i = 0; i < 2; i++) balls.push(makeBall(spd)); SFX.powerup(); }
  else if (type === 'laser')  { puLaser = 540; laserCd = 0; puLaserLvl = Math.min(2, puLaserLvl + 1); SFX.powerup(); }
  else if (type === 'catch')  { puCatch = 720; SFX.powerup(); }
  else if (type === 'pierce') { puPierce = 420; SFX.powerup(); }
  else if (type === 'shrink') { puShrink = 480; puWide = 0; setPaddleW(); SFX.bad(); }
  else if (type === 'life')   { if (lives < 10) { lives++; extraFlash = 90; SFX.extra(); } else addScore(100); SFX.powerup(); }
}
function damageBrick(br) {
  br.hp--; br.flash = 1;
  const cx = br.x + br.w / 2;
  if (br.hp <= 0) {
    br.alive = false; combo++; comboTimer = 110;
    const mult = combo >= 5 ? 5 : combo >= 3 ? 3 : combo >= 2 ? 2 : 1;
    const pts  = 10 * level * mult;
    addScore(pts);
    popups.push({ x: cx, y: br.y, txt: '+' + pts, life: 1, color: br.color });
    shake = Math.min(shake + 1.6, 6);
    SFX.break(cx);
    spawnParticles(cx, br.y + br.h / 2, br.color, 18);
    if (Math.random() < 0.10) spawnDrop(cx, br.y + br.h / 2);
    updateUI();
    return true;
  }
  SFX.hit(cx);
  spawnParticles(cx, br.y + br.h / 2, br.color, 5);
  return false;
}

function update() {
  if (puWide   > 0) { puWide--;   if (puWide   === 0) { setPaddleW(); updateUI(); } }
  if (puShrink > 0) { puShrink--; if (puShrink === 0) { setPaddleW(); updateUI(); } }
  if (puSlow   > 0) { puSlow--;   if (puSlow   === 0) updateUI(); }
  if (puCatch  > 0) { puCatch--;  if (puCatch  === 0) updateUI(); }
  if (puPierce > 0) { puPierce--; if (puPierce === 0) updateUI(); }
  if (comboTimer > 0) comboTimer--; else combo = 0;
  if (lvFlash > 0) lvFlash--;
  if (extraFlash > 0) extraFlash--;
  for (const br of bricks) if (br.flash > 0) br.flash -= 0.07;

  if (keyL) mouseX = Math.max(0,  mouseX - 11);
  if (keyR) mouseX = Math.min(LW, mouseX + 11);
  let tx = mouseX - paddle.w / 2;
  tx = Math.max(0, Math.min(LW - paddle.w, tx));
  paddle.x += (tx - paddle.x) * 0.18;

  if (puLaser > 0) {
    puLaser--;
    if (laserCd > 0) laserCd--;
    else {
      if (puLaserLvl >= 2) lasers.push({ x: paddle.x + 7, y: paddle.y }, { x: paddle.x + paddle.w - 7, y: paddle.y });
      else                 lasers.push({ x: paddle.x + paddle.w / 2, y: paddle.y });
      laserCd = 15; SFX.laser(paddle.x + paddle.w / 2);
    }
    if (puLaser === 0) { puLaserLvl = 0; updateUI(); }
  }
  for (let i = lasers.length - 1; i >= 0; i--) {
    const l = lasers[i];
    l.y -= 9.5;
    let dead = l.y < -12;
    for (const br of bricks) {
      if (!br.alive) continue;
      if (l.x >= br.x && l.x <= br.x + br.w && l.y >= br.y && l.y <= br.y + br.h) {
        dead = true;
        if (br.fixed) { SFX.wall(l.x); spawnParticles(l.x, br.y + br.h, '#445566', 3); }
        else damageBrick(br);
        break;
      }
    }
    if (dead) lasers.splice(i, 1);
  }

  const slowMult = puSlow > 0 ? 0.58 : 1;
  for (let bi = balls.length - 1; bi >= 0; bi--) {
    const b = balls[bi];
    if (b.stuck) {
      b.x = paddle.x + paddle.w / 2 + b.off;
      b.y = paddle.y - b.r - 1;
      b.trail.length = 0;
      continue;
    }
    b.trail.push({ x: b.x, y: b.y });
    if (b.trail.length > 8) b.trail.shift();
    b.x += b.vx * slowMult; b.y += b.vy * slowMult;
    if (b.x - b.r < 0)  { b.x = b.r;      b.vx =  Math.abs(b.vx); SFX.wall(b.x); }
    if (b.x + b.r > LW) { b.x = LW - b.r; b.vx = -Math.abs(b.vx); SFX.wall(b.x); }
    if (b.y - b.r < 0)  { b.y = b.r;      b.vy =  Math.abs(b.vy); SFX.wall(b.x); }

    if (b.vy > 0 &&
        b.y + b.r >= paddle.y && b.y - b.r <= paddle.y + paddle.h &&
        b.x >= paddle.x - 4   && b.x <= paddle.x + paddle.w + 4) {
      if (puCatch > 0) {
        b.spd   = Math.hypot(b.vx, b.vy); b.stuck = true;
        b.off   = Math.max(-paddle.w / 2 + b.r, Math.min(paddle.w / 2 - b.r, b.x - (paddle.x + paddle.w / 2)));
        b.vx = b.vy = 0; b.y = paddle.y - b.r - 1; SFX.catch(b.x);
      } else {
        const rel   = (b.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
        const angle = rel * 65 * Math.PI / 180;
        const spd   = Math.hypot(b.vx, b.vy);
        b.vx = Math.sin(angle) * spd; b.vy = -Math.abs(Math.cos(angle) * spd);
        b.y  = paddle.y - b.r; SFX.paddle(b.x);
        spawnParticles(b.x, paddle.y, '#00f5ff', 6);
      }
    }
    for (const br of bricks) {
      if (!br.alive) continue;
      const cx = Math.max(br.x, Math.min(b.x, br.x + br.w));
      const cy = Math.max(br.y, Math.min(b.y, br.y + br.h));
      const dx = b.x - cx, dy = b.y - cy;
      if (dx * dx + dy * dy >= b.r * b.r) continue;
      const phasing = !br.fixed && br.hp <= 1 && puPierce > 0;
      if (!phasing) {
        const ox = Math.min(b.x - br.x, br.x + br.w - b.x);
        const oy = Math.min(b.y - br.y, br.y + br.h - b.y);
        if (ox < oy) b.vx *= -1; else b.vy *= -1;
      }
      if (br.fixed) { SFX.wall(b.x); spawnParticles(br.x + br.w / 2, br.y + br.h / 2, '#445566', 4); }
      else damageBrick(br);
      if (!phasing) break;
    }
    if (b.y - b.r > LH) balls.splice(bi, 1);
  }

  if (balls.length === 0) {
    lives--; shake = 8;
    puLaser = 0; puLaserLvl = 0; puPierce = 0; lasers = [];
    updateUI();
    if (lives <= 0) {
      if (score > hiScore) { hiScore = score; saveHi(); }
      SFX.over();
      showOverlay('GAME OVER', 'Score: ' + score, 'RETRY');
      running = false; return;
    }
    SFX.life();
    combo = 0; puMulti = false;
    balls = [makeBall(ballSpeed(), true)];
    updateUI();
  }

  if (bricks.every(b => !b.alive || b.fixed)) {
    SFX.level(); addScore(level * 100); level++;
    puWide = 0; puSlow = 0; puMulti = false;
    puLaser = 0; puLaserLvl = 0; puCatch = 0; puPierce = 0; puShrink = 0;
    initLevel(); return;
  }

  for (const d of drops) {
    if (!d.alive) continue;
    d.y += d.vy; d.t += 0.12; d.roll += 0.16;
    if (d.y > paddle.y && d.y < paddle.y + paddle.h + 12 &&
        d.x > paddle.x - 10 && d.x < paddle.x + paddle.w + 10) {
      d.alive = false; applyDrop(d.type);
      spawnParticles(d.x, d.y, d.color, 20); updateUI();
    }
    if (d.y > LH) d.alive = false;
  }
  drops = drops.filter(d => d.alive);

  if (puMulti && balls.length <= 1) { puMulti = false; updateUI(); }

  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.life -= p.decay; }
  particles = particles.filter(p => p.life > 0);
  for (const pp of popups) { pp.y -= 0.7; pp.life -= 0.022; }
  popups = popups.filter(p => p.life > 0);
}

/* ============================================================
   3D RENDER SYNC
   ============================================================ */
const _tmpCol = new THREE.Color();
function render3D() {
  if (!paddle) return;

  // paddle (glass pill)
  const pcx = paddle.x + paddle.w / 2;
  const worldW = paddle.w * SX;
  if (Math.abs(worldW - _paddleGeoW) > 0.01) buildPaddleGeo(worldW);
  const px = lx(pcx), py = ly(paddle.y + paddle.h / 2);
  paddleMesh.position.set(px, py, PADDLE_Z);
  paddleCore.position.set(px, py, PADDLE_Z);
  paddleTick.position.set(px, py, PADDLE_Z);
  paddleLight.position.set(px, ly(paddle.y), 18);
  const tint = puShrink > 0 ? 0xff5566 : puWide > 0 ? 0x33ff99 : 0x7ff2ff;
  paddleCoreMat.emissive.set(tint);
  paddleMat.attenuationColor.set(puShrink > 0 ? 0xff5566 : puWide > 0 ? 0x33ff99 : 0x16d6ff);

  // bricks
  for (const br of bricks) {
    const o = br.obj; if (!o) continue;
    o.mesh.visible = o.edge.visible = br.alive;
    if (!br.alive) continue;
    const dim = br.hp < br.maxHp ? 0.45 : 1;
    o.mat.opacity = dim;
    o.mat.emissiveIntensity = 0.9 + (br.flash > 0 ? br.flash * 2.0 : 0);
    o.edge.material.opacity = 0.4 + 0.55 * dim;
  }

  // balls + trails
  for (let i = 0; i < ballMeshes.length; i++) {
    if (i < balls.length) ballMeshes[i].mesh.visible = ballMeshes[i].trail.visible = true;
    else { ballMeshes[i].mesh.visible = ballMeshes[i].trail.visible = false; ballMeshes[i].light.visible = false; }
  }
  for (let i = 0; i < balls.length; i++) {
    const b = balls[i], o = ensureBall(i);
    o.mesh.visible = true; o.light.visible = true;
    o.mesh.position.set(lx(b.x), ly(b.y), 4.5);
    const pierce = puPierce > 0;
    const bcol = pierce ? 0x00ff88 : 0xffe600;
    o.mat.emissive.set(bcol);
    o.light.color.set(bcol);
    o.halo.material.color.set(bcol);
    // trail
    const pos = o.trail.geometry.attributes.position.array;
    const col = o.trail.geometry.attributes.color.array;
    const tn = b.trail.length;
    _tmpCol.set(pierce ? 0x00ff88 : 0xffe600);
    for (let k = 0; k < tn; k++) {
      const t = b.trail[k];
      pos[k*3] = lx(t.x); pos[k*3+1] = ly(t.y); pos[k*3+2] = 4.5;
      const f = (k + 1) / tn * 0.8;
      col[k*3] = _tmpCol.r * f; col[k*3+1] = _tmpCol.g * f; col[k*3+2] = _tmpCol.b * f;
    }
    o.trail.geometry.setDrawRange(0, tn);
    o.trail.geometry.attributes.position.needsUpdate = true;
    o.trail.geometry.attributes.color.needsUpdate = true;
    o.trail.visible = tn > 1;
  }

  // drops as rolling cylinders
  for (let i = 0; i < dropObjs.length; i++) {
    if (i >= drops.length) { dropObjs[i].mesh.visible = dropObjs[i].spr.visible = false; }
  }
  for (let i = 0; i < drops.length; i++) {
    const d = drops[i], o = ensureDrop(i);
    o.mesh.visible = o.spr.visible = true;
    const X = lx(d.x), Y = ly(d.y);
    o.mesh.position.set(X, Y, 7);
    o.mesh.rotation.x = d.roll;
    o.mat.emissive.set(d.color);
    o.spr.position.set(X, Y - 14, 9);   // near side, facing the player as it rolls in
    if (o.sprMat.map?._label !== d.label) {
      o.sprMat.map = labelTexture(d.label, d.color);
      o.sprMat.map._label = d.label;
      o.sprMat.needsUpdate = true;
    }
  }

  // lasers
  for (let i = 0; i < laserMeshes.length; i++) laserMeshes[i].visible = i < lasers.length;
  for (let i = 0; i < lasers.length; i++) {
    const l = lasers[i], m = ensureLaser(i);
    m.visible = true; m.position.set(lx(l.x), ly(l.y), 5);
  }

  // particles
  let pc = 0;
  for (let i = 0; i < particles.length && pc < PMAX; i++) {
    const p = particles[i];
    pPos[pc*3] = lx(p.x); pPos[pc*3+1] = ly(p.y); pPos[pc*3+2] = 5;
    _tmpCol.set(p.color);
    const f = Math.max(0, p.life);
    pCol[pc*3] = _tmpCol.r * f; pCol[pc*3+1] = _tmpCol.g * f; pCol[pc*3+2] = _tmpCol.b * f;
    pc++;
  }
  pGeo.setDrawRange(0, pc);
  pGeo.attributes.position.needsUpdate = true;
  pGeo.attributes.color.needsUpdate = true;

  // paddle-follow camera — gentle & aspect-aware so both bottom corners always stay framed.
  const aspect    = camera.aspect;
  const narrow    = Math.max(0, 1 / Math.max(aspect, 0.34) - 1);   // grows as the screen gets more portrait
  const followAmt = THREE.MathUtils.clamp(aspect * 0.52, 0.30, 0.56);
  const baseZ     = 155 + narrow * 26;                              // closer on tall screens; the upright board still fits the width
  const restY     = 30 + narrow * 16 + Math.sin(performance.now() * 0.0006) * 0.7; // lift to look down the upright board
  const lookY     = -12 - narrow * 6;                               // tilt the gaze down only as the screen gets portrait
  const targetX   = lx(pcx) * followAmt;
  camera.position.x += (targetX - camera.position.x) * 0.10;
  camera.position.z += (baseZ - camera.position.z) * 0.08;
  if (shake > 0.1) {
    camera.position.x += (Math.random() - 0.5) * shake * 0.6;
    camera.position.y = restY + (Math.random() - 0.5) * shake * 0.6;
    shake *= 0.88;
  } else { camera.position.y += (restY - camera.position.y) * 0.1; shake = 0; }
  camera.lookAt(camera.position.x * 0.82, lookY, 15);             // view target lags the camera → keeps the field centred

  composer.render();
}

/* ============================================================
   HUD OVERLAY  (screen-space text effects)
   ============================================================ */
function drawHUD() {
  hctx.clearRect(0, 0, W, H);

  // score popups (projected from brick positions)
  for (const pp of popups) {
    const s = toScreen(lx(pp.x), ly(pp.y), 8);
    if (!s.vis) continue;
    hctx.save();
    hctx.globalAlpha = Math.max(0, Math.min(1, pp.life * 1.4));
    hctx.fillStyle = pp.color;
    hctx.shadowBlur = 10; hctx.shadowColor = pp.color;
    hctx.font = 'bold 15px Orbitron, monospace';
    hctx.textAlign = 'center'; hctx.textBaseline = 'bottom';
    hctx.fillText(pp.txt, s.x, s.y);
    hctx.restore();
  }

  if (combo >= 3 && comboTimer > 0) {
    hctx.save();
    hctx.globalAlpha = Math.min(comboTimer / 30, 1);
    hctx.fillStyle = '#ffe600'; hctx.shadowBlur = 20; hctx.shadowColor = '#ffe600';
    hctx.font = 'bold 22px Orbitron, monospace';
    hctx.textAlign = 'center'; hctx.textBaseline = 'middle';
    hctx.fillText('x' + Math.min(combo, 9) + ' COMBO', W / 2, H - 70);
    hctx.restore();
  }

  if (extraFlash > 0) {
    hctx.save();
    hctx.globalAlpha = Math.min(extraFlash / 30, 1);
    hctx.fillStyle = '#ff006e'; hctx.shadowBlur = 24; hctx.shadowColor = '#ff006e';
    hctx.font = 'bold 34px Orbitron, sans-serif';
    hctx.textAlign = 'center'; hctx.textBaseline = 'middle';
    hctx.fillText('EXTRA LIFE', W / 2, 120);
    hctx.restore();
  }

  if (lvFlash > 0) {
    const t = lvFlash / 100;
    const a = t < 0.2 ? t / 0.2 : t > 0.8 ? (1 - t) / 0.2 : 1;
    hctx.save();
    hctx.globalAlpha = a * 0.6;
    hctx.fillStyle = '#02040a'; hctx.fillRect(0, 0, W, H);
    hctx.globalAlpha = a;
    hctx.textAlign = 'center'; hctx.textBaseline = 'middle';
    hctx.shadowBlur = 40; hctx.shadowColor = '#00f5ff'; hctx.fillStyle = '#00f5ff';
    hctx.font = 'bold 64px Orbitron, sans-serif';
    hctx.fillText('LEVEL ' + level, W / 2, H / 2 - 30);
    hctx.shadowColor = '#00f5ff88'; hctx.fillStyle = '#00f5ffaa';
    hctx.font = '16px Share Tech Mono, monospace';
    hctx.fillText(LEVEL_NAMES[(level - 1) % LEVEL_NAMES.length], W / 2, H / 2 + 24);
    hctx.restore();
  }

  if (muted) {
    hctx.save();
    hctx.globalAlpha = 0.5; hctx.fillStyle = '#00f5ff';
    hctx.textAlign = 'center'; hctx.textBaseline = 'top';
    hctx.font = '11px Share Tech Mono, monospace';
    hctx.fillText('MUTED [M]', W / 2, 16);
    hctx.restore();
  }

  if (paused) {
    hctx.save();
    hctx.globalAlpha = 0.72; hctx.fillStyle = '#02040a'; hctx.fillRect(0, 0, W, H);
    hctx.globalAlpha = 1; hctx.textAlign = 'center'; hctx.textBaseline = 'middle';
    hctx.shadowBlur = 36; hctx.shadowColor = '#00f5ff'; hctx.fillStyle = '#00f5ff';
    hctx.font = 'bold 64px Orbitron, sans-serif';
    hctx.fillText('PAUSED', W / 2, H / 2 - 16);
    hctx.shadowColor = '#00f5ff88'; hctx.fillStyle = '#00f5ffaa';
    hctx.font = '14px Share Tech Mono, monospace';
    hctx.fillText('SPACE / P / DOUBLE-TAP TO RESUME', W / 2, H / 2 + 30);
    hctx.restore();
  }
}

/* ============================================================
   MAIN LOOP  (always renders; updates only while running)
   ============================================================ */
let idleSpin = 0;
function loop(now) {
  requestAnimationFrame(loop);
  if (now === undefined) now = performance.now();
  if (lastTime === 0) lastTime = now;
  let frameTime = now - lastTime;
  lastTime = now;
  if (frameTime > 250) frameTime = 250;

  if (floorTex) floorTex.offset.y = (floorTex.offset.y - frameTime * 0.00004) % 1;

  if (dust) {
    const p = dust.geometry.attributes.position.array;
    for (let i = 0; i < p.length; i += 3) {
      p[i+2] += frameTime * 0.012;                       // drift toward the camera
      p[i]   += Math.sin(now * 0.0003 + i) * 0.02;       // faint lateral sway
      if (p[i+2] > 165) {                                // recycle once past the camera
        p[i+2] -= 330;
        p[i]    = (Math.random() - 0.5) * 440;
        p[i+1]  = (Math.random() - 0.5) * 280 + 20;
      }
    }
    dust.geometry.attributes.position.needsUpdate = true;
  }

  if (running && !paused) {
    accumulator += frameTime;
    let steps = 0;
    while (accumulator >= STEP && steps < 5) {
      update(); accumulator -= STEP; steps++;
      if (!running) break;
    }
    if (steps >= 5) accumulator = 0;
  }

  if (running) { render3D(); drawHUD(); }
  else {
    // idle menu scene: slow camera drift over an empty tunnel
    idleSpin += frameTime * 0.0002;
    const narrow = Math.max(0, 1 / Math.max(camera.aspect, 0.34) - 1);
    camera.position.x = Math.sin(idleSpin) * 22;
    camera.position.y = 30 + narrow * 16;
    camera.position.z += (155 + narrow * 26 - camera.position.z) * 0.06;
    camera.lookAt(camera.position.x * 0.4, -12 - narrow * 6, 15);
    hctx.clearRect(0, 0, W, H);
    composer.render();
  }
}
requestAnimationFrame(loop);

/* ============================================================
   INPUT
   ============================================================ */
window.addEventListener('mousemove', e => { mouseX = (e.clientX / W) * LW; });
window.addEventListener('mousedown', () => { resumeAC(); if (running && !paused) launchStuck(); });
window.addEventListener('touchmove', e => {
  e.preventDefault(); mouseX = (e.touches[0].clientX / W) * LW;
}, { passive: false });
window.addEventListener('touchstart', e => {
  resumeAC();
  if (e.target.closest('.start-btn')) return;   // let the button handle it
  e.preventDefault();
  mouseX = (e.touches[0].clientX / W) * LW;
  if (!running) { startGame(); lastTap = 0; return; }
  const now = Date.now();
  if (now - lastTap < 300) { togglePause(); lastTap = 0; return; }
  lastTap = now;
  if (!paused) launchStuck();
}, { passive: false });
document.addEventListener('keydown', e => {
  if (e.code === 'ArrowLeft'  || e.code === 'KeyA') keyL = true;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keyR = true;
  if (e.code === 'KeyM') muted = !muted;
  if (e.code === 'KeyP') togglePause();
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault(); resumeAC();
    if (!running) startGame();
    else if (paused) togglePause();
    else if (!launchStuck()) togglePause();
  }
});
document.addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft'  || e.code === 'KeyA') keyL = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keyR = false;
});
</script>
