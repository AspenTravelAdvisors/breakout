<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Breakout — Neon Edition</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');
:root {
  --bg: #020408;
  --neon-cyan: #00f5ff;
  --neon-pink: #ff006e;
  --neon-yellow: #ffe600;
  --neon-green: #00ff88;
  --glow-cyan: 0 0 8px #00f5ff, 0 0 20px #00f5ffaa, 0 0 40px #00f5ff44;
  --glow-pink: 0 0 8px #ff006e, 0 0 20px #ff006eaa, 0 0 40px #ff006e44;
  --glow-yellow: 0 0 8px #ffe600, 0 0 20px #ffe600aa;
  --glow-green: 0 0 8px #00ff88, 0 0 20px #00ff88aa;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; min-height: 100vh; background: var(--bg);
  font-family: 'Share Tech Mono', monospace;
  color: var(--neon-cyan); user-select: none;
  overflow-x: hidden;
}
body {
  display: flex; align-items: center; justify-content: center;
  padding: 20px 8px; position: relative;
}
body::before {
  content: ''; position: fixed; inset: 0;
  background:
    repeating-linear-gradient(0deg, transparent, transparent 40px, #00f5ff07 40px, #00f5ff07 41px),
    repeating-linear-gradient(90deg, transparent, transparent 40px, #00f5ff07 40px, #00f5ff07 41px);
  pointer-events: none; z-index: 0;
}
#game-wrap {
  position: relative; z-index: 1;
  display: flex; flex-direction: column; align-items: center;
  gap: 10px; width: 100%; max-width: 520px;
}
#header {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; padding: 0 2px;
}
.title {
  font-family: 'Orbitron', sans-serif; font-weight: 900;
  font-size: clamp(16px, 5vw, 28px); letter-spacing: 6px;
  color: var(--neon-cyan); text-shadow: var(--glow-cyan);
  text-transform: uppercase;
}
.stat-block { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.stat-label { font-size: 9px; letter-spacing: 3px; color: #00f5ff66; text-transform: uppercase; }
.stat-value {
  font-family: 'Orbitron', sans-serif; font-size: clamp(13px, 4vw, 20px);
  font-weight: 700; color: var(--neon-yellow); text-shadow: var(--glow-yellow);
  min-width: 60px; text-align: right;
}
#canvas-container { position: relative; width: 100%; }
canvas {
  display: block; width: 100%; height: auto;
  border: 1px solid #00f5ff33;
  box-shadow: 0 0 0 1px #00f5ff11, 0 0 30px #00f5ff22, inset 0 0 30px #00f5ff06;
  background: #010d18;
}
#overlay {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: #010d18ee; transition: opacity 0.3s;
}
#overlay.hidden { opacity: 0; pointer-events: none; }
.overlay-title {
  font-family: 'Orbitron', sans-serif; font-weight: 900;
  font-size: clamp(20px, 7vw, 42px); letter-spacing: 6px;
  color: var(--neon-cyan); text-shadow: var(--glow-cyan);
  margin-bottom: 6px; text-align: center;
}
.overlay-sub {
  font-size: clamp(8px, 2.5vw, 11px); letter-spacing: 3px;
  color: #00f5ff77; margin-bottom: 28px;
  text-transform: uppercase; text-align: center; padding: 0 12px;
}
.start-btn {
  font-family: 'Orbitron', sans-serif; font-weight: 700;
  font-size: clamp(10px, 3vw, 14px); letter-spacing: 4px;
  color: var(--bg); background: var(--neon-cyan); border: none;
  padding: 12px 32px; cursor: pointer; text-transform: uppercase;
  box-shadow: var(--glow-cyan);
  clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
  transition: all 0.2s;
}
.start-btn:hover, .start-btn:active {
  background: var(--neon-pink); box-shadow: var(--glow-pink); transform: scale(1.05);
}
.hi-score-line { margin-top: 16px; font-size: 10px; letter-spacing: 3px; color: #00f5ff44; }
.hi-score-val { color: var(--neon-yellow); }
#lives-row {
  display: flex; gap: 8px; align-items: center;
  width: 100%; padding: 0 2px;
}
.lives-label { font-size: 9px; letter-spacing: 3px; color: #00f5ff55; text-transform: uppercase; margin-right: 4px; }
.life-pip {
  width: 22px; height: 6px; background: var(--neon-pink);
  box-shadow: var(--glow-pink);
  clip-path: polygon(4px 0%, 100% 0%, calc(100% - 4px) 100%, 0% 100%);
  transition: all 0.3s;
}
.life-pip.dead { background: #1a0008; box-shadow: none; }
#level-display { margin-left: auto; font-size: 9px; letter-spacing: 3px; color: #00f5ff55; text-transform: uppercase; }
#level-num { color: var(--neon-green); text-shadow: var(--glow-green); font-family: 'Orbitron', sans-serif; font-weight: 700; }
#powerup-row { display: flex; gap: 6px; align-items: center; width: 100%; padding: 0 2px; min-height: 16px; }
.pu-pill {
  font-size: 8px; letter-spacing: 2px; padding: 2px 7px; border: 1px solid;
  text-transform: uppercase; font-family: 'Orbitron', sans-serif; font-weight: 700;
  transition: opacity 0.3s;
}
.pu-wide  { color: #00ff88; border-color: #00ff88; box-shadow: 0 0 6px #00ff8866; }
.pu-slow  { color: #00f5ff; border-color: #00f5ff; box-shadow: 0 0 6px #00f5ff66; }
.pu-multi { color: #ffe600; border-color: #ffe600; box-shadow: 0 0 6px #ffe60066; }
</style>
</head>
<body>
<div id="game-wrap">
  <div id="header">
    <div class="title">BREAKOUT</div>
    <div class="stat-block">
      <div class="stat-label">Score</div>
      <div class="stat-value" id="score-display">0</div>
    </div>
  </div>
  <div id="canvas-container">
    <canvas id="c" width="480" height="560"></canvas>
    <div id="overlay">
      <div class="overlay-title" id="overlay-title">BREAKOUT</div>
      <div class="overlay-sub" id="overlay-sub">Classic Arcade · Neon Edition</div>
      <button class="start-btn" id="start-btn" onclick="startGame()">LAUNCH</button>
      <div class="hi-score-line">HI-SCORE <span class="hi-score-val" id="hi-display">0</span></div>
    </div>
  </div>
  <div id="lives-row">
    <span class="lives-label">Hull</span>
    <div id="pips" style="display:flex; gap:8px; align-items:center;"></div>
    <div id="level-display">LEVEL <span id="level-num">1</span></div>
  </div>
  <div id="powerup-row"></div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const LW = 480, LH = 560;

const AC = (() => {
  try { return new (window.AudioContext || window.webkitAudioContext)(); }
  catch(e) { return null; }
})();

function tone(freq, type, dur, vol = 0.15, startDelay = 0) {
  if (!AC) return;
  try {
    const o = AC.createOscillator(), g = AC.createGain();
    o.connect(g); g.connect(AC.destination);
    o.type = type; o.frequency.value = freq;
    const t = AC.currentTime + startDelay;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.start(t); o.stop(t + dur + 0.01);
  } catch(e) {}
}

function noise(dur, vol = 0.1, bandFreq = 800, startDelay = 0) {
  if (!AC) return;
  try {
    const buf  = AC.createBuffer(1, AC.sampleRate * dur, AC.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    const src = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter();
    src.buffer = buf; src.connect(f); f.connect(g); g.connect(AC.destination);
    f.type = 'bandpass'; f.frequency.value = bandFreq; f.Q.value = 1;
    const t = AC.currentTime + startDelay;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.start(t);
  } catch(e) {}
}

const SFX = {
  wall:    () => { tone(560, 'square', 0.04, 0.07); },
  paddle:  () => { tone(380, 'square', 0.05, 0.12); tone(620, 'square', 0.03, 0.06); },
  hit:     () => { noise(0.04, 0.07, 600); tone(280, 'square', 0.03, 0.05); },
  break:   () => { noise(0.09, 0.13, 900); tone(180, 'sawtooth', 0.1, 0.09); },
  powerup: () => { [523,659,784,1047].forEach((f,i) => tone(f,'sine',0.14,0.14,i*0.07)); },
  life:    () => { [360,280,200,140].forEach((f,i) => tone(f,'sawtooth',0.14,0.13,i*0.1)); },
  extra:   () => { [523,784,1047,1319].forEach((f,i) => tone(f,'sine',0.18,0.14,i*0.06)); },
  level:   () => { [523,659,784,880,1047].forEach((f,i) => tone(f,'square',0.18,0.1,i*0.08)); },
  over:    () => { [280,220,180,140,100].forEach((f,i) => tone(f,'sawtooth',0.22,0.12,i*0.15)); },
};

function resumeAC() { if (AC && AC.state === 'suspended') AC.resume(); }

const PX = {
  r:'#ff006e', o:'#ff6a00', y:'#ffe600', g:'#00ff88',
  c:'#00f5ff', b:'#3a86ff', p:'#bf00ff', w:'#f5f9ff', m:'#ff5fd2'
};

const LEVEL_NAMES = [
  'INITIATE','PYRAMID','HEARTBEAT','INVADER','SMILE',
  'STARFALL','PRISM','SKULL','VOLTAGE','FORTRESS',
  'FUNGUS','PHANTOM','FELINE','LIFTOFF','ROYALTY',
  'SAUCER','ABYSS','LABYRINTH','PAPILLON','OMEGA'
];

const LEVEL_MAPS = [
  // 1 — intro rows
  ['cccccccccc',
   'gggggggggg',
   'yyyyyyyyyy',
   'oooooooooo'],
  // 2 — pyramid
  ['.....c.....',
   '....ccc....',
   '...ccccc...',
   '..ccccccc..',
   '.ccccccccc.',
   'ccccccccccc'],
  // 3 — heart
  ['..rr...rr..',
   '.rrrr.rrrr.',
   'rrrrrrrrrrr',
   'rrrrrrrrrrr',
   '.rrrrrrrrr.',
   '..rrrrrrr..',
   '...rrrrr...',
   '....rrr....',
   '.....r.....'],
  // 4 — invader
  ['..p.....p..',
   '...p...p...',
   '..ppppppp..',
   '.pp.ppp.pp.',
   'ppppppppppp',
   'p.ppppppp.p',
   'p.p.....p.p',
   '...pp.pp...'],
  // 5 — smiley
  ['...yyyyy...',
   '.yyyyyyyyy.',
   'yyyyyyyyyyy',
   'yyy.yyy.yyy',
   'yyy.yyy.yyy',
   'yyyyyyyyyyy',
   'yyy.....yyy',
   '.yyyyyyyyy.',
   '...yyyyy...'],
  // 6 — star
  ['.....y.....',
   '.....y.....',
   '....yyy....',
   'yyyyyyyyyyy',
   '.yyyyyyyyy.',
   '..yyyyyyy..',
   '..yyy.yyy..',
   '.yy.....yy.',
   '.y.......y.'],
  // 7 — diamond
  ['.....c.....',
   '....ccc....',
   '...ccccc...',
   '..ccccccc..',
   '.ccccccccc.',
   'ccccccccccc',
   '.ccccccccc.',
   '..ccccccc..',
   '...ccccc...',
   '....ccc....',
   '.....c.....'],
  // 8 — skull
  ['..wwwwwww..',
   '.wwwwwwwww.',
   'wwwwwwwwwww',
   'ww..www..ww',
   'ww..www..ww',
   'wwwww.wwwww',
   '.wwwwwwwww.',
   '.w.w.w.w.w.'],
  // 9 — voltage
  ['......yyy..',
   '.....yyy...',
   '....yyy....',
   '..yyyyyyy..',
   '....yyy....',
   '...yyy.....',
   '..yyy......',
   '.yyy.......'],
  // 10 — fortress
  ['###########',
   '#ccccccccc#',
   '#cyyyyyyyc#',
   '#cyrrrrryc#',
   '#cyyyyyyyc#',
   '#ccccccccc#',
   '###########'],
  // 11 — mushroom
  ['...rrrrr...',
   '..rrwwwrr..',
   '.rrwwwwwrr.',
   'rrwwrrrwwrr',
   'rrrrrrrrrrr',
   '...wwwww...',
   '...wwwww...',
   '...wwwww...'],
  // 12 — ghost
  ['...ppppp...',
   '..ppppppp..',
   '.ppppppppp.',
   '.pwwpppwwp.',
   '.pwwpppwwp.',
   '.ppppppppp.',
   '.ppppppppp.',
   '.p.p.p.p.p.'],
  // 13 — cat
  ['gg.......gg',
   'ggg.....ggg',
   'ggggggggggg',
   'gg.ggggg.gg',
   'ggggggggggg',
   'ggggg.ggggg',
   'ggggggggggg',
   '.ggggggggg.'],
  // 14 — rocket
  ['.....r.....',
   '....rrr....',
   '....ccc....',
   '...rrrrr...',
   '...rrrrr...',
   '...rrrrr...',
   '..rrrrrrr..',
   '.rr.rrr.rr.',
   'o..o.o.o..o'],
  // 15 — crown
  ['y....y....y',
   'yy..yyy..yy',
   'yyyyyyyyyyy',
   'yyryyyyyryy',
   'yyyyyyyyyyy'],
  // 16 — saucer
  ['...ggggg...',
   '..ggggggg..',
   '.ggggggggg.',
   'ccccccccccc',
   'cycycycycyc'],
  // 17 — fish
  ['......ccc..',
   'c...cccccc.',
   'cc.cccccccc',
   'ccccccc.ccc',
   'cc.cccccccc',
   'c...cccccc.',
   '......ccc..'],
  // 18 — labyrinth
  ['#.#.#.#.#.#',
   '.r.r.r.r.r.',
   '#.#.#.#.#.#',
   '.g.g.g.g.g.',
   '#.#.#.#.#.#',
   '.y.y.y.y.y.',
   '#.#.#.#.#.#'],
  // 19 — butterfly
  ['pp.......pp',
   'ppp.....ppp',
   'pppp.y.pppp',
   'pppppyppppp',
   'pppp.y.pppp',
   'ppp.....ppp',
   'pp.......pp'],
  // 20 — omega boss
  ['###.....###',
   '#rrrrrrrrr#',
   'rr.rrrrr.rr',
   'rrr.rrr.rrr',
   'rrrrrrrrrrr',
   'r.r.r.r.r.r',
   'rrrrrrrrrrr',
   '#rrrrrrrrr#']
];

function ballSpeed() { return Math.min(1.6 + level * 0.4, 11); }

function buildLayout(level) {
  const map     = LEVEL_MAPS[(level - 1) % LEVEL_MAPS.length];
  const extraHp = Math.floor((level - 1) / LEVEL_MAPS.length);
  return { map, extraHp };
}

let score, hiScore = 0, lives, level;
let bricks, balls, paddle, particles, drops;
let running = false, animId, paused = false;
let mouseX = LW / 2;
let lastTap = 0;
let combo = 0, comboTimer = 0;
let puWide = 0, puSlow = 0, puMulti = false;
let lvFlash = 0;
let nextLife = 5000, extraFlash = 0;

function getScale() { return LW / canvas.getBoundingClientRect().width; }

canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouseX = (e.clientX - r.left) * getScale();
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  mouseX = (e.touches[0].clientX - r.left) * getScale();
}, { passive: false });
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  resumeAC();
  const r = canvas.getBoundingClientRect();
  mouseX = (e.touches[0].clientX - r.left) * getScale();
  if (!running) { startGame(); lastTap = 0; return; }
  const now = Date.now();
  if (now - lastTap < 300) { togglePause(); lastTap = 0; }
  else lastTap = now;
}, { passive: false });
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    resumeAC();
    if (!running) startGame();
    else togglePause();
  }
});

function togglePause() {
  if (!running) return;
  paused = !paused;
}

function startGame() {
  document.getElementById('overlay').classList.add('hidden');
  level = 1; score = 0; lives = 3;
  nextLife = 5000; extraFlash = 0;
  puWide = 0; puSlow = 0; puMulti = false;
  combo = 0; comboTimer = 0;
  paused = false;
  initLevel();
  running = true;
  if (animId) cancelAnimationFrame(animId);
  loop();
}

function initLevel() {
  particles = []; drops = [];
  lvFlash = 100;

  const { map, extraHp } = buildLayout(level);
  const rows   = map.length;
  const cols   = Math.max(...map.map(r => r.length));
  const gap    = 3;
  const maxW   = LW - 24;
  const size   = Math.min((maxW - (cols - 1) * gap) / cols, 32);
  const gridW  = size * cols + gap * (cols - 1);
  const offX   = (LW - gridW) / 2;
  const offY   = 40;
  const baseHp = 1 + Math.floor((level - 1) / 7) + extraHp;

  bricks = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < map[r].length; c++) {
      const ch = map[r][c];
      if (ch === '.' || ch === ' ') continue;
      const fixed = ch === '#';
      const color = fixed ? '#445566' : (PX[ch] || '#00f5ff');
      const hp    = fixed ? 99 : baseHp;
      bricks.push({
        x: offX + c * (size + gap),
        y: offY + r * (size + gap),
        w: size, h: size,
        color, glow: color,
        hp, maxHp: hp, alive: true, fixed
      });
    }
  }

  balls = [makeBall(ballSpeed())];

  const pw = puWide > 0 ? 130 : 90;
  paddle = { x: LW / 2 - pw / 2, y: LH - 34, w: pw, h: 10 };

  updateUI();
}

function makeBall(spd) {
  const ang = (Math.random() * 0.5 - 0.25) * Math.PI;
  return {
    x: LW / 2, y: LH - 100, r: 6,
    vx: Math.sin(ang) * spd,
    vy: -Math.cos(ang) * spd,
    trail: []
  };
}

function updateUI() {
  document.getElementById('score-display').textContent = score;
  document.getElementById('level-num').textContent     = level;
  const pips = document.getElementById('pips');
  pips.innerHTML = '';
  for (let i = 0; i < Math.min(lives, 10); i++) {
    const d = document.createElement('div');
    d.className = 'life-pip';
    pips.appendChild(d);
  }

  const row = document.getElementById('powerup-row');
  row.innerHTML = '';
  if (puWide  > 0)   row.innerHTML += '<div class="pu-pill pu-wide">WIDE</div>';
  if (puSlow  > 0)   row.innerHTML += '<div class="pu-pill pu-slow">SLOW</div>';
  if (puMulti)        row.innerHTML += '<div class="pu-pill pu-multi">MULTI</div>';
}

function addScore(n) {
  score += n;
  let gained = false;
  while (score >= nextLife) {
    nextLife += 5000;
    lives++;
    gained = true;
    extraFlash = 90;
    SFX.extra();
  }
  if (gained) updateUI();
  else document.getElementById('score-display').textContent = score;
}

function showOverlay(title, sub, btn) {
  document.getElementById('overlay-title').textContent = title;
  document.getElementById('overlay-sub').textContent   = sub;
  document.getElementById('start-btn').textContent     = btn;
  document.getElementById('hi-display').textContent    = hiScore;
  document.getElementById('overlay').classList.remove('hidden');
}

function spawnParticles(x, y, color, n = 12) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 1.5 + Math.random() * 3.5;
    particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 1, decay: 0.025 + Math.random() * 0.03,
      size: 2 + Math.random() * 3, color
    });
  }
}

const DROP_TYPES  = ['wide', 'slow', 'multi'];
const DROP_COLORS = { wide: '#00ff88', slow: '#00f5ff', multi: '#ffe600' };
const DROP_LABELS = { wide: 'W',       slow: 'S',       multi: 'M'       };

function spawnDrop(x, y) {
  const type = DROP_TYPES[Math.floor(Math.random() * DROP_TYPES.length)];
  drops.push({ x, y, vy: 1.3, type, color: DROP_COLORS[type], label: DROP_LABELS[type], alive: true, t: 0 });
}

function loop() {
  if (!running) return;
  if (!paused) update();
  draw();
  animId = requestAnimationFrame(loop);
}

function update() {
  if (puWide > 0) { puWide--; if (puWide === 0) { paddle.w = 90; updateUI(); } }
  if (puSlow > 0) { puSlow--; if (puSlow === 0) updateUI(); }

  if (comboTimer > 0) comboTimer--; else combo = 0;

  if (lvFlash > 0) lvFlash--;
  if (extraFlash > 0) extraFlash--;

  let tx = mouseX - paddle.w / 2;
  tx = Math.max(0, Math.min(LW - paddle.w, tx));
  paddle.x += (tx - paddle.x) * 0.18;

  const slowMult = puSlow > 0 ? 0.58 : 1;

  if (lvFlash > 0) {
    for (const b of balls) {
      b.x = paddle.x + paddle.w / 2;
      b.y = paddle.y - b.r - 2;
      b.trail.length = 0;
    }
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.life -= p.decay;
    }
    particles = particles.filter(p => p.life > 0);
    return;
  }

  for (let bi = balls.length - 1; bi >= 0; bi--) {
    const b = balls[bi];

    b.trail.push({ x: b.x, y: b.y });
    if (b.trail.length > 8) b.trail.shift();

    b.x += b.vx * slowMult;
    b.y += b.vy * slowMult;

    if (b.x - b.r < 0)  { b.x = b.r;      b.vx =  Math.abs(b.vx); SFX.wall(); }
    if (b.x + b.r > LW) { b.x = LW - b.r; b.vx = -Math.abs(b.vx); SFX.wall(); }
    if (b.y - b.r < 0)  { b.y = b.r;      b.vy =  Math.abs(b.vy); SFX.wall(); }

    if (b.vy > 0 &&
        b.y + b.r >= paddle.y && b.y - b.r <= paddle.y + paddle.h &&
        b.x >= paddle.x - 4   && b.x <= paddle.x + paddle.w + 4) {
      const rel   = (b.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
      const angle = rel * 65 * Math.PI / 180;
      const spd   = Math.hypot(b.vx, b.vy);
      b.vx = Math.sin(angle) * spd;
      b.vy = -Math.abs(Math.cos(angle) * spd);
      b.y  = paddle.y - b.r;
      SFX.paddle();
      spawnParticles(b.x, paddle.y, '#00f5ff', 6);
    }

    for (const br of bricks) {
      if (!br.alive) continue;
      const cx = Math.max(br.x, Math.min(b.x, br.x + br.w));
      const cy = Math.max(br.y, Math.min(b.y, br.y + br.h));
      const dx = b.x - cx, dy = b.y - cy;
      if (dx * dx + dy * dy >= b.r * b.r) continue;

      const ox = Math.min(b.x - br.x, br.x + br.w - b.x);
      const oy = Math.min(b.y - br.y, br.y + br.h - b.y);
      if (ox < oy) b.vx *= -1; else b.vy *= -1;

      if (br.fixed) {
        SFX.wall();
        spawnParticles(br.x + br.w / 2, br.y + br.h / 2, '#445566', 4);
      } else {
        br.hp--;
        if (br.hp <= 0) {
          br.alive = false;
          combo++;
          comboTimer = 110;
          const mult = combo >= 5 ? 5 : combo >= 3 ? 3 : combo >= 2 ? 2 : 1;
          addScore(10 * level * mult);
          SFX.break();
          spawnParticles(br.x + br.w / 2, br.y + br.h / 2, br.color, 18);
          if (Math.random() < 0.14) spawnDrop(br.x + br.w / 2, br.y + br.h / 2);
        } else {
          SFX.hit();
          spawnParticles(br.x + br.w / 2, br.y + br.h / 2, br.color, 5);
        }
        updateUI();
      }
      break;
    }

    if (b.y - b.r > LH) balls.splice(bi, 1);
  }

  if (balls.length === 0) {
    lives--;
    updateUI();
    if (lives <= 0) {
      if (score > hiScore) hiScore = score;
      SFX.over();
      showOverlay('GAME OVER', 'Score: ' + score, 'RETRY');
      running = false;
      return;
    }
    SFX.life();
    combo = 0;
    puMulti = false;
    balls = [makeBall(ballSpeed())];
    updateUI();
  }

  if (bricks.every(b => !b.alive || b.fixed)) {
    SFX.level();
    addScore(level * 100);
    level++;
    puWide = 0; puSlow = 0; puMulti = false;
    initLevel();
    return;
  }

  for (const d of drops) {
    if (!d.alive) continue;
    d.y += d.vy; d.t += 0.12;
    if (d.y > paddle.y && d.y < paddle.y + paddle.h + 12 &&
        d.x > paddle.x - 10 && d.x < paddle.x + paddle.w + 10) {
      d.alive = false;
      SFX.powerup();
      if (d.type === 'wide') {
        puWide = 600; paddle.w = 130;
        paddle.x = Math.min(paddle.x, LW - 130);
      } else if (d.type === 'slow') {
        puSlow = 500;
      } else if (d.type === 'multi') {
        puMulti = true;
        const spd = ballSpeed();
        for (let i = 0; i < 2; i++) balls.push(makeBall(spd));
      }
      spawnParticles(d.x, d.y, d.color, 20);
      updateUI();
    }
    if (d.y > LH) d.alive = false;
  }
  drops = drops.filter(d => d.alive);

  if (puMulti && balls.length <= 1) { puMulti = false; updateUI(); }

  for (const p of particles) {
    p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.life -= p.decay;
  }
  particles = particles.filter(p => p.life > 0);
}

function draw() {
  ctx.clearRect(0, 0, LW, LH);

  ctx.fillStyle = 'rgba(0,0,0,0.03)';
  for (let y = 0; y < LH; y += 4) ctx.fillRect(0, y, LW, 1);

  for (const p of particles) {
    ctx.save();
    ctx.globalAlpha  = p.life;
    ctx.fillStyle    = p.color;
    ctx.shadowBlur   = 10;
    ctx.shadowColor  = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    ctx.restore();
  }

  for (const b of bricks) {
    if (!b.alive) continue;
    ctx.save();
    ctx.globalAlpha = b.hp < b.maxHp ? 0.42 : 1;
    ctx.shadowBlur  = 14;
    ctx.shadowColor = b.glow;

    if (b.fixed) {
      ctx.fillStyle   = '#1c2d3a';
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.strokeStyle = '#445566';
      ctx.lineWidth   = 1.5;
      ctx.strokeRect(b.x + 0.75, b.y + 0.75, b.w - 1.5, b.h - 1.5);
      ctx.strokeStyle = '#2a3e4e';
      ctx.lineWidth   = 0.5;
      ctx.beginPath();
      for (let x = b.x + 5; x < b.x + b.w; x += 7) {
        ctx.moveTo(x, b.y); ctx.lineTo(x, b.y + b.h);
      }
      ctx.stroke();
    } else {
      ctx.fillStyle   = b.color + '28';
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.strokeStyle = b.color;
      ctx.lineWidth   = 1.5;
      ctx.strokeRect(b.x + 0.75, b.y + 0.75, b.w - 1.5, b.h - 1.5);
      ctx.fillStyle = 'rgba(255,255,255,0.09)';
      ctx.fillRect(b.x + 2, b.y + 2, b.w - 4, 4);
      if (b.maxHp >= 2) {
        ctx.strokeStyle = 'rgba(255,255,255,' + (b.hp / b.maxHp * 0.35) + ')';
        ctx.lineWidth   = 0.5;
        ctx.beginPath();
        for (let seg = 1; seg < b.maxHp && seg < 5; seg++) {
          const sx = b.x + b.w * seg / b.maxHp;
          ctx.moveTo(sx, b.y + 4); ctx.lineTo(sx, b.y + b.h - 4);
        }
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  for (const d of drops) {
    const pulse = 0.72 + 0.28 * Math.sin(d.t);
    ctx.save();
    ctx.globalAlpha = pulse;
    ctx.shadowBlur  = 18;
    ctx.shadowColor = d.color;
    ctx.strokeStyle = d.color;
    ctx.lineWidth   = 1.5;
    ctx.fillStyle   = d.color + '33';
    ctx.fillRect(d.x - 11, d.y - 9, 22, 18);
    ctx.strokeRect(d.x - 11, d.y - 9, 22, 18);
    ctx.fillStyle    = d.color;
    ctx.font         = 'bold 10px Orbitron, monospace';
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(d.label, d.x, d.y);
    ctx.restore();
  }

  ctx.save();
  ctx.shadowBlur  = 22;
  ctx.shadowColor = '#00f5ff';
  const pg = ctx.createLinearGradient(paddle.x, 0, paddle.x + paddle.w, 0);
  pg.addColorStop(0,   '#00f5ff44');
  pg.addColorStop(0.5, '#00f5ffcc');
  pg.addColorStop(1,   '#00f5ff44');
  ctx.fillStyle   = pg;
  ctx.strokeStyle = '#00f5ff';
  ctx.lineWidth   = 1.5;
  const pr = 4;
  ctx.beginPath();
  ctx.moveTo(paddle.x + pr, paddle.y);
  ctx.lineTo(paddle.x + paddle.w - pr, paddle.y);
  ctx.quadraticCurveTo(paddle.x + paddle.w, paddle.y, paddle.x + paddle.w, paddle.y + pr);
  ctx.lineTo(paddle.x + paddle.w, paddle.y + paddle.h - pr);
  ctx.quadraticCurveTo(paddle.x + paddle.w, paddle.y + paddle.h, paddle.x + paddle.w - pr, paddle.y + paddle.h);
  ctx.lineTo(paddle.x + pr, paddle.y + paddle.h);
  ctx.quadraticCurveTo(paddle.x, paddle.y + paddle.h, paddle.x, paddle.y + paddle.h - pr);
  ctx.lineTo(paddle.x, paddle.y + pr);
  ctx.quadraticCurveTo(paddle.x, paddle.y, paddle.x + pr, paddle.y);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.14)';
  ctx.fillRect(paddle.x + 6, paddle.y + 2, paddle.w - 12, 3);
  ctx.restore();

  for (const b of balls) {
    for (let i = 1; i <= b.trail.length; i++) {
      const t = b.trail[b.trail.length - i];
      ctx.save();
      ctx.globalAlpha = 0.11 / i;
      ctx.shadowBlur  = 6;
      ctx.shadowColor = '#ffe600';
      ctx.beginPath();
      ctx.arc(t.x, t.y, b.r * Math.max(0.2, 1 - i * 0.1), 0, Math.PI * 2);
      ctx.fillStyle = '#ffe600';
      ctx.fill();
      ctx.restore();
    }
    ctx.save();
    ctx.shadowBlur  = 26;
    ctx.shadowColor = '#ffe600';
    const bg = ctx.createRadialGradient(b.x - 1.5, b.y - 1.5, 0, b.x, b.y, b.r);
    bg.addColorStop(0,   '#ffffff');
    bg.addColorStop(0.3, '#ffe600');
    bg.addColorStop(1,   '#ff6a00');
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fillStyle = bg;
    ctx.fill();
    ctx.restore();
  }

  if (lvFlash > 0) {
    const t  = lvFlash / 100;
    const a  = t < 0.2 ? t / 0.2 : t > 0.8 ? (1 - t) / 0.2 : 1;
    ctx.save();
    ctx.globalAlpha = a * 0.88;
    ctx.fillStyle   = '#010d18';
    ctx.fillRect(0, 0, LW, LH);
    ctx.globalAlpha = a;
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowBlur   = 36;
    ctx.shadowColor  = '#00f5ff';
    ctx.fillStyle    = '#00f5ff';
    ctx.font         = 'bold 40px Orbitron, sans-serif';
    ctx.fillText('LEVEL ' + level, LW / 2, LH / 2 - 22);
    ctx.shadowColor = '#00f5ff88';
    ctx.fillStyle   = '#00f5ff88';
    ctx.font        = '11px Share Tech Mono, monospace';
    ctx.fillText(LEVEL_NAMES[((level - 1) % LEVEL_NAMES.length)], LW / 2, LH / 2 + 16);
    ctx.restore();
  }

  if (extraFlash > 0) {
    ctx.save();
    ctx.globalAlpha  = Math.min(extraFlash / 30, 1);
    ctx.shadowBlur   = 22;
    ctx.shadowColor  = '#ff006e';
    ctx.fillStyle    = '#ff006e';
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.font         = 'bold 24px Orbitron, sans-serif';
    ctx.fillText('EXTRA LIFE', LW / 2, 92);
    ctx.restore();
  }

  if (combo >= 3 && comboTimer > 0) {
    ctx.save();
    ctx.globalAlpha  = Math.min(comboTimer / 30, 1);
    ctx.shadowBlur   = 20;
    ctx.shadowColor  = '#ffe600';
    ctx.fillStyle    = '#ffe600';
    ctx.textAlign    = 'right';
    ctx.textBaseline = 'bottom';
    ctx.font         = 'bold 13px Orbitron, monospace';
    ctx.fillText('x' + Math.min(combo, 9) + ' COMBO', LW - 8, LH - 8);
    ctx.restore();
  }

  if (paused) {
    ctx.save();
    ctx.globalAlpha  = 0.72;
    ctx.fillStyle    = '#010d18';
    ctx.fillRect(0, 0, LW, LH);
    ctx.globalAlpha  = 1;
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowBlur   = 32;
    ctx.shadowColor  = '#00f5ff';
    ctx.fillStyle    = '#00f5ff';
    ctx.font         = 'bold 40px Orbitron, sans-serif';
    ctx.fillText('PAUSED', LW / 2, LH / 2 - 12);
    ctx.shadowColor  = '#00f5ff88';
    ctx.fillStyle    = '#00f5ff88';
    ctx.font         = '11px Share Tech Mono, monospace';
    ctx.fillText('SPACE / DOUBLE-TAP TO RESUME', LW / 2, LH / 2 + 20);
    ctx.restore();
  }
}
</script>
